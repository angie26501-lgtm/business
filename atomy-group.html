<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf4fb">
<title>艾多美・艾揪團｜接龍小幫手</title>
<style>
:root{--bg:#f3f8fc;--card:#fff;--ink:#1d3347;--mut:#6b7f90;--blue:#1f7ac2;--blue2:#e3f1fb;--pink:#e2557a;--line:#d8e6f1}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.6}
header{background:linear-gradient(135deg,#d9eefb,#fbe6ee);padding:22px 16px 18px;text-align:center}
header .tag{display:inline-block;background:#fff;color:var(--pink);font-weight:700;border-radius:20px;padding:3px 12px;font-size:14px}
header h1{margin:8px 0 4px;font-size:26px}
header .sub{color:var(--mut);font-size:15px}
main{max-width:720px;margin:0 auto;padding:14px 14px 170px}
.how{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.how ol{margin:6px 0 0;padding-left:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(31,122,194,.06)}
.card h3{margin:0 0 4px;font-size:19px}
.card .deal{display:inline-block;background:#fde8ee;color:var(--pink);font-weight:700;border-radius:8px;padding:1px 8px;font-size:14px;margin:2px 0}
.card .rule{color:var(--mut);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.price{font-size:22px;font-weight:800;color:var(--blue)}
.price small{font-size:14px;color:var(--mut);font-weight:400}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:12px;border:0;font-size:24px;font-weight:700;background:var(--blue);color:#fff}
.qty button.m{background:var(--blue2);color:var(--blue)}
.qty b{min-width:28px;text-align:center;font-size:20px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--blue);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
#bar .in{max-width:720px;margin:0 auto}
#bar input{width:100%;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
#sum{font-size:15px;color:var(--mut);margin-bottom:8px}
#sum b{color:var(--ink);font-size:18px}
.btns{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:12px;font-size:17px;font-weight:700;background:var(--pink);color:#fff}
.btn.gh{flex:0 0 auto;background:var(--blue2);color:var(--blue)}
#out{display:none;background:#fff;border:2px dashed var(--blue);border-radius:14px;padding:12px;margin-top:6px}
#out pre{white-space:pre-wrap;font-family:inherit;margin:6px 0 0;font-size:16px}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;display:none;z-index:9}
.note{font-size:13px;color:var(--mut);margin-top:16px;text-align:center}
</style>
</head>
<body>
<header>
<span class="tag">💖 艾揪團</span>
<h1>艾多美・揪團小幫手</h1>
<div class="sub">鹿藥師陪你聊健康找好康｜主揪 小鹿藥師雅婷</div>
</header>
<main>
<div class="how"><b>📝 怎麼＋1？</b>
<ol>
<li>在想要的商品按藍色「＋」</li>
<li>最下面填上你在群組的名字</li>
<li>按「📋 複製接龍文字」</li>
<li>回到群組，長按輸入框「貼上」送出，主揪會幫你排進接龍 💕</li>
</ol></div>
<div id="list"></div>
<div id="out"><b>✅ 已複製！回群組貼上送出就完成囉</b><pre id="txt"></pre></div>
<div class="note">價格依主揪群組公告為準；成團、出貨時間由主揪通知。<br>本頁只產生接龍文字，不會記錄任何個人資料。</div>
</main>
<div id="bar"><div class="in">
<input id="nm" placeholder="你在群組的名字（例如：小美）" maxlength="20">
<div id="sum">已選 <b id="cnt">0</b> 件・合計 <b id="tot">$0</b></div>
<div class="btns"><button class="btn" id="cp">📋 複製接龍文字</button><button class="btn gh" id="clr">清空</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
// 資料來源：鹿藥師陪你聊健康找好康 群組 11/25 最新「艾揪團」接龍與商品介紹
const P=[
 {id:'cream',g:'柔護寶貝保濕乳霜366元/條',n:'柔護寶貝保濕乳霜',p:366,u:'條',deal:'雙11 特價 3 條 $1,099',rule:'原價 $480／條，平均每條 $366（省 $341）・大人小孩都能用'},
 {id:'lact',g:'牛奶胜肽兩罐2460元/120顆',n:'牛奶胜肽',p:2460,u:'份',deal:'兩罐 $2,460',rule:'1 份＝兩罐（共 120 顆）'},
 {id:'amp',g:'凝萃煥膚安瓶優惠 兩罐2530再送洗面乳',n:'凝萃煥膚安瓶',p:2530,u:'份',deal:'兩罐 $2,530 再送洗面乳',rule:'原價 $2,730，大省 $200・兩組成團'}
];
const K='atomyGrp1';let q={};try{q=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const nmEl=document.getElementById('nm');try{nmEl.value=localStorage.getItem(K+'nm')||''}catch(e){}
const fmt=n=>'$'+n.toLocaleString('en-US');
function save(){try{localStorage.setItem(K,JSON.stringify(q));localStorage.setItem(K+'nm',nmEl.value)}catch(e){}}
function draw(){
 document.getElementById('list').innerHTML=P.map(r=>`<div class="card"><h3>❤️ ${r.n}</h3><span class="deal">${r.deal}</span><div class="rule">${r.rule}</div>
 <div class="row"><div class="price">${fmt(r.p)}<small>／${r.u}</small></div><div class="qty"><button class="m" data-m="${r.id}" aria-label="減少">−</button><b>${q[r.id]||0}</b><button data-p="${r.id}" aria-label="增加">＋</button></div></div></div>`).join('');
 let c=0,t=0;P.forEach(r=>{const n=q[r.id]||0;c+=n;t+=n*r.p});
 document.getElementById('cnt').textContent=c;document.getElementById('tot').textContent=fmt(t);
}
document.getElementById('list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.p)q[b.dataset.p]=(q[b.dataset.p]||0)+1;
 if(b.dataset.m)q[b.dataset.m]=Math.max(0,(q[b.dataset.m]||0)-1);
 save();draw();document.getElementById('out').style.display='none'});
nmEl.addEventListener('input',save);
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
document.getElementById('cp').onclick=async()=>{
 const nm=nmEl.value.trim();const ks=P.filter(r=>q[r.id]>0);
 if(!ks.length)return toast('先按「＋」選商品喔');
 if(!nm){nmEl.focus();return toast('請填上你的名字')}
 let t=0;const lines=['艾揪團 ＋1'];
 ks.forEach(r=>{t+=q[r.id]*r.p;lines.push('',`❤️${r.g}`,`${nm}*${q[r.id]}`)});
 lines.push('',`合計 ${fmt(t)}`);
 const s=lines.join('\n');
 try{await navigator.clipboard.writeText(s)}catch(e){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
 document.getElementById('txt').textContent=s;const o=document.getElementById('out');o.style.display='block';o.scrollIntoView({behavior:'smooth'});toast('已複製！');
};
document.getElementById('clr').onclick=()=>{q={};save();draw();document.getElementById('out').style.display='none';toast('已清空')};
draw();
</script>
</body>
</html>
