
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>馥芸工作台｜保戶服務＋待辦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef1ea;--surface:#ffffff;--ink:#22302a;--muted:#6c7a6f;--primary:#1f4a3a;--primary-soft:#e6efe9;--accent:#c79348;--accent-soft:#f7edda;--urgent:#b14a31;--urgent-soft:#f6e4de;--line:#dde3d9;--shadow:0 2px 14px rgba(31,74,58,.07);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:82px;}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px;}
  header{background:linear-gradient(155deg,#1f4a3a 0%,#2c5d4a 100%);color:#fff;padding:18px 0 22px;border-radius:0 0 22px 22px;box-shadow:var(--shadow);}
  .brand{display:flex;align-items:center;gap:8px;font-size:14.5px;letter-spacing:1px;opacity:.85;font-weight:500;}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .topline{display:flex;justify-content:space-between;align-items:center;margin-top:3px;}
  .date{font-size:14.5px;opacity:.7;}
  .sync{font-size:13.5px;font-weight:700;background:rgba(255,255,255,.12);border:none;color:#fff;padding:4px 10px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .sync .sdot{width:7px;height:7px;border-radius:50%;background:#9bbfae;}
  .sync.ok .sdot{background:#7fd6a2;} .sync.busy .sdot{background:var(--accent);} .sync.off .sdot{background:#e0a08a;}
  .mswitch{display:flex;gap:6px;margin-top:13px;background:rgba(255,255,255,.12);padding:4px;border-radius:12px;}
  .mswitch button{flex:1;border:none;background:transparent;color:rgba(255,255,255,.78);font-family:inherit;font-size:15.5px;font-weight:700;padding:9px;border-radius:9px;cursor:pointer;}
  .mswitch button.active{background:#fff;color:var(--primary);}
  .totals{display:flex;gap:10px;margin-top:13px;}
  .tcard{flex:1;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;}
  .tcard .lbl{font-size:14.5px;opacity:.8;}
  .tcard .num{font-size:26px;font-weight:900;margin-top:3px;letter-spacing:-.5px;}
  .tcard.gold .num{color:var(--accent);}
  .tcard .num small{font-size:14px;font-weight:500;opacity:.75;margin-right:2px;}
  nav{display:flex!important;flex-wrap:wrap!important;overflow:visible!important;gap:7px;padding:14px 14px 6px;max-width:560px;margin:0 auto;}
  
  .tab{flex:0 0 auto;border:none;background:var(--surface);color:var(--muted);font-family:inherit;font-size:15px;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);transition:.18s;}
  .tab .c{display:inline-block;min-width:18px;font-size:12.5px;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:1px 6px;margin-left:5px;}
  .tab.active{background:var(--primary);color:#fff;}
  .tab.active .c{background:rgba(255,255,255,.22);color:#fff;}
  section{display:none;padding-top:10px;}
  section.show{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .item{background:var(--surface);border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:11px;align-items:flex-start;border-left:3px solid transparent;transition:.18s;}
  .item.urgent{border-left-color:var(--urgent);}
  .item.done{opacity:.55;} .item.done .name{text-decoration:line-through;}
  .check{flex:0 0 auto;width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;transition:.15s;}
  .item.done .check{background:var(--primary);border-color:var(--primary);}
  .body{flex:1;min-width:0;}
  .name{font-weight:700;font-size:17px;}
  .detail{font-size:14.5px;color:var(--muted);margin-top:2px;word-break:break-word;}
  .meta{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap;}
  .pill{font-size:13.5px;font-weight:700;padding:2px 9px;border-radius:999px;}
  .pill.notified{background:var(--primary-soft);color:var(--primary);}
  .pill.urgent{background:var(--urgent-soft);color:var(--urgent);}
  .pill.wait{background:var(--accent-soft);color:#9a6b1e;}
  .amt{display:flex;align-items:center;gap:3px;font-weight:900;color:var(--primary);font-size:16.5px;}
  .amt small{font-weight:500;font-size:12.5px;color:var(--muted);}
  .amt input{width:82px;font-family:inherit;font-weight:900;font-size:16.5px;color:var(--primary);border:none;border-bottom:1.5px dashed var(--line);background:transparent;text-align:right;padding:0 2px 1px;}
  .amt input:focus{outline:none;border-bottom-color:var(--accent);}
  .del{margin-left:auto;background:none;border:none;color:#c4ccc1;font-size:20px;cursor:pointer;padding:0 2px;line-height:1;}
  .add{width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:16px;font-weight:700;padding:12px;border-radius:14px;cursor:pointer;margin-top:2px;}
  .add:active{background:var(--surface);}
  .empty{text-align:center;color:var(--muted);font-size:16px;padding:24px 0;}
  .rcard{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow);border-left:3px solid var(--accent);}
  .rcard.complete{border-left-color:var(--primary);}
  .rhead{display:flex;align-items:flex-start;gap:8px;}
  .rhead .body{flex:1;}
  .rstat{font-size:15px;font-weight:700;color:var(--accent);margin-top:1px;}
  .rcard.complete .rstat{color:var(--primary);}
  .steps{display:flex;margin-top:13px;}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;cursor:pointer;}
  .step .node{width:27px;height:27px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#aab4a9;z-index:2;transition:.18s;}
  .step.done .node{background:var(--primary);border-color:var(--primary);color:#fff;}
  .step.current .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .step .slabel{font-size:12px;margin-top:6px;color:var(--muted);text-align:center;line-height:1.25;}
  .step.done .slabel{color:var(--primary);font-weight:700;}
  .step.current .slabel{color:var(--accent);font-weight:700;}
  .step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line);z-index:1;}
  .step:first-child::before{display:none;}
  .step.done::before{background:var(--primary);}
  .snotes{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;}
  .snrow{display:flex;align-items:baseline;gap:8px;padding:6px 4px;border-radius:8px;cursor:pointer;}
  .snrow:active{background:var(--bg);}
  .snlab{flex:0 0 auto;font-size:12.5px;font-weight:700;color:#9aa89c;min-width:82px;}
  .snrow.sdone .snlab{color:var(--primary);}
  .snrow.scur .snlab{color:var(--accent);}
  .sntxt{flex:1;font-size:13px;color:var(--ink);word-break:break-word;}
  .snempty{color:#b3bdb2;font-weight:500;}
  .inote{margin-top:8px;font-size:13px;color:var(--ink);cursor:pointer;padding:5px 8px;background:var(--bg);border-radius:8px;display:inline-block;max-width:100%;word-break:break-word;}
  .inote:active{opacity:.7;}
  .guide{background:var(--surface);border-radius:14px;padding:2px 14px;margin-bottom:11px;box-shadow:var(--shadow);}
  .guide summary{font-weight:700;padding:11px 0;cursor:pointer;color:var(--primary);font-size:14.5px;list-style:none;}
  .guide summary::-webkit-details-marker{display:none;}
  .guide summary::before{content:"▸ ";color:var(--accent);}
  .guide[open] summary::before{content:"▾ ";}
  .guide ol{margin:0 0 12px;padding-left:22px;}
  .guide li{margin-bottom:7px;line-height:1.5;font-size:14px;color:#3a4a40;}
  /* todo mode */
  .tprog{background:var(--surface);border-radius:12px;padding:12px 14px;margin:12px 0;box-shadow:var(--shadow);}
  .tprog .prow{display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--primary);}
  .bar2{height:8px;background:var(--primary-soft);border-radius:999px;margin-top:8px;overflow:hidden;}
  .fill2{height:100%;background:var(--accent);border-radius:999px;transition:width .3s;}
  .toolbar{display:flex;gap:8px;margin-bottom:10px;}
  .toolbar button{flex:1;background:var(--surface);border:none;color:var(--primary);font-family:inherit;font-size:14px;font-weight:700;padding:9px;border-radius:11px;box-shadow:var(--shadow);cursor:pointer;}
  details.theme{background:var(--surface);border-radius:16px;margin-bottom:11px;box-shadow:var(--shadow);overflow:hidden;}
  details.theme > summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:11px;font-weight:700;font-size:16.5px;}
  details.theme > summary::-webkit-details-marker{display:none;}
  .tw-ico{font-size:20px;} .tw-name{flex:1;}
  .tw-count{font-size:13px;font-weight:700;background:var(--primary-soft);color:var(--primary);border-radius:999px;padding:2px 10px;min-width:26px;text-align:center;}
  .tw-count.zero{background:#e9ede8;color:#9aa89c;}
  .tw-arrow{color:var(--accent);font-size:14px;transition:transform .2s;}
  details.theme[open] .tw-arrow{transform:rotate(90deg);}
  .tasks{padding:0 16px 8px;}
  .task{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-top:1px solid var(--line);}
  .task:first-child{border-top:none;}
  .chk{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:#fff;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:.15s;}
  .task.done .chk{background:var(--primary);border-color:var(--primary);}
  .tbody{flex:1;min-width:0;}
  .txt{font-size:15.5px;word-break:break-word;}
  .task.done .txt{text-decoration:line-through;color:var(--muted);}
  .tnote{margin-top:5px;font-size:13px;color:var(--ink);cursor:pointer;padding:4px 8px;background:var(--bg);border-radius:8px;display:inline-block;max-width:100%;word-break:break-word;}
  .tnote:active{opacity:.7;}
  .nempty{color:#b3bdb2;font-weight:500;}
  .addtask{width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:14.5px;font-weight:700;padding:11px;border-radius:11px;cursor:pointer;margin:4px 0 10px;}
  .bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:11px 14px;display:flex;gap:9px;max-width:560px;margin:0 auto;}
  .bar button{flex:1;font-family:inherit;font-size:16px;font-weight:700;padding:11px;border-radius:11px;border:none;cursor:pointer;}
  .bar .line{background:#06C755;color:#fff;}
  .bar .copy{background:var(--primary);color:#fff;}
  .bar .reset{background:#fff;color:var(--urgent);border:1px solid var(--urgent-soft);flex:0 0 auto;padding:11px 14px;}
  .bar .addtheme{background:#fff;color:var(--accent);border:1px solid var(--accent-soft);}
  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:16px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:50;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .fsbar{display:flex;align-items:center;gap:7px;margin-top:12px;}
  .fsbar .lb{font-size:13px;color:rgba(255,255,255,.72);letter-spacing:1px;}
  .fsbar button{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.3);color:#fff;
    border-radius:9px;width:40px;height:38px;font-family:inherit;font-weight:900;cursor:pointer;line-height:1;padding:0;}
  .fsbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);}
  .fsbar button.s1{font-size:14px;} .fsbar button.s2{font-size:17px;} .fsbar button.s3{font-size:21px;}
  .mask{position:fixed;inset:0;background:rgba(20,30,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:60;}
  .mask.show{display:flex;}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 30px rgba(0,0,0,.16);max-height:88vh;overflow:auto;}
  .sheet h3{margin:0 0 6px;font-size:23px;font-weight:900;color:var(--ink);}
  .sheet .sub{font-size:16px;color:var(--muted);margin-bottom:16px;line-height:1.6;}
  .sheet .opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;
    padding:18px 17px;margin-bottom:12px;font-family:inherit;cursor:pointer;}
  .sheet .opt b{display:block;font-size:19px;color:var(--ink);margin-bottom:3px;}
  .sheet .opt span{font-size:15px;color:var(--muted);line-height:1.55;}
  .sheet .opt.warn{background:#fff6f4;border-color:var(--urgent-soft);}
  .sheet .opt.warn b{color:var(--urgent);}
  .sheet .close{width:100%;background:var(--ink);color:#fff;border:none;border-radius:13px;padding:16px;
    font-family:inherit;font-size:18px;font-weight:800;cursor:pointer;margin-top:4px;}
  .sheet .meta{font-size:15px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6;}
  .sheet .meta.stale{color:var(--urgent);font-weight:700;}
  .searchbar{max-width:560px;margin:10px auto 0;padding:0 14px;display:flex;gap:8px;align-items:center;}
  .searchbar input{flex:1;font-family:inherit;font-size:15px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);outline:none;}
  .searchbar input:focus{border-color:var(--primary);}
  .searchbar button{background:var(--surface);border:1.5px solid var(--line);color:var(--muted);font-size:16px;padding:9px 13px;border-radius:12px;cursor:pointer;}
  .srhead{font-size:13px;color:var(--muted);font-weight:700;margin:4px 2px 8px;}
  .srcat{font-size:12px;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:2px 9px;margin-left:8px;}
  .bar .data{background:var(--accent);color:#fff;border:none;flex:1;padding:11px;font-size:17px;font-weight:900;letter-spacing:1px;}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><span class="dot"></span>馥芸財富學苑 · 財顧芸 Angie</div>
    <div class="topline">
      <div class="date" id="dateLbl">工作台</div>
      <span id="pendBadge" onclick="restorePrePull()" style="display:none;align-items:center;gap:4px;background:#c0392b;color:#fff;font-size:13px;font-weight:800;padding:5px 11px;border-radius:999px;cursor:pointer;margin-right:7px;" title="點一下可還原到同步前的狀態"></span>
      <button class="sync" id="syncBtn" onclick="syncMenu()"><span class="sdot"></span><span id="syncTxt">本機模式</span></button>
    </div>
    <div class="fsbar">
      <span class="lb">字級</span>
      <button class="s1" data-fs="1"    onclick="setFS(1)"    aria-pressed="true"  aria-label="標準字級">A</button>
      <button class="s2" data-fs="1.15" onclick="setFS(1.15)" aria-pressed="false" aria-label="大字級">A</button>
      <button class="s3" data-fs="1.32" onclick="setFS(1.32)" aria-pressed="false" aria-label="特大字級">A</button>
    </div>
    <div class="mswitch">
      <button id="mSvc" class="active" onclick="switchMode('svc')">保戶服務</button>
      <button id="mTodo" onclick="switchMode('todo')">待辦清單</button>
    </div>
    <div class="totals" id="svcTotals">
      <div class="tcard gold"><div class="lbl">待收金額</div><div class="num" id="dueNum"><small>NT$</small>0</div></div>
      <div class="tcard"><div class="lbl">已收金額</div><div class="num" id="paidNum"><small>NT$</small>0</div></div>
    </div>
  </div>
</header>

<div class="wrap"><div id="bkAlert" style="display:none;background:#fff2ee;border:2px solid #e8a99c;border-radius:14px;
  padding:14px 16px;margin:12px 0 0;font-size:16.5px;font-weight:700;color:#b4322a;line-height:1.6;">
  <span id="bkAlertTxt"></span>
  <button onclick="dataSheet()" style="display:block;width:100%;margin-top:10px;background:#b4322a;color:#fff;border:none;
    border-radius:10px;padding:13px;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;">現在備份</button>
</div></div>
<div id="svcMode">
  <nav id="tabs" style="display:flex;flex-wrap:wrap;overflow:visible;"></nav>
  <div class="searchbar"><input type="search" id="searchInput" placeholder="🔍 搜尋客戶、保單、內容…（跨所有分頁）" autocomplete="off"><button id="searchClear" onclick="clearSearch()" style="display:none">✕</button></div>
  <div class="wrap" id="content"></div>
</div>

<div id="todoMode" style="display:none">
  <div class="wrap">
    <div class="tprog">
      <div class="prow"><span>待辦進度</span><span id="tProgTxt">0 / 0</span></div>
      <div class="bar2"><div class="fill2" id="tProgFill" style="width:0%"></div></div>
    </div>
    <div class="toolbar">
      <button onclick="tbSetAll(true)">全部展開</button>
      <button onclick="tbSetAll(false)">全部收合</button>
    </div>
    <div id="tboard"></div>
  </div>
</div>

<div class="bar" id="svcBar">
  <button class="data" onclick="dataSheet()" title="備份／還原">備份</button>
  <button class="line" onclick="openLine()">LINE 下單</button>
  <button class="copy" onclick="copySummary()">複製總表</button>
  <button class="reset" onclick="resetAll()">清空</button>
</div>
<div class="bar" id="todoBar" style="display:none">
  <button class="data" onclick="dataSheet()" title="備份／還原">備份</button>
  <button class="copy" onclick="tbCopyAll()">複製清單</button>
  <button class="addtheme" onclick="tbAddTheme()">＋ 主題</button>
  <button class="reset" onclick="tbReset()">重設</button>
</div>
<div class="mask" id="dataMask" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="資料備份與還原">
    <h3>資料保全</h3>
    <div class="sub">這個工具的資料存在瀏覽器裡。換電腦、清快取、或不小心重設，都會消失——所以要留一份在自己手上。</div>
    <button class="opt" onclick="backupAll()">
      <b>備份到檔案</b>
      <span>把目前所有資料存成一個檔，下載到「下載」資料夾。建議收進 Google Drive。</span>
    </button>
    <button class="opt" onclick="copyReadable()">
      <b>複製成文字</b>
      <span>看得懂的版本，可貼進記事本或 LINE 給自己。適合當日誌留存。</span>
    </button>
    <button class="opt warn" onclick="restorePick()">
      <b>從檔案還原</b>
      <span>用備份檔覆蓋現在的資料。還原前會自動先備份一次現況，不會沒有退路。</span>
    </button>
    <div class="meta" id="bkMeta"></div>
    <button class="close" onclick="closeSheet()">關閉</button>
  </div>
</div>
<input type="file" id="bkFile" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ============ 共用 ============ */
function showToast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }
function esc(s){ return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function switchMode(m){
  const svc=m==='svc';
  document.getElementById('svcMode').style.display=svc?'block':'none';
  document.getElementById('svcBar').style.display=svc?'flex':'none';
  document.getElementById('svcTotals').style.display=svc?'flex':'none';
  document.getElementById('todoMode').style.display=svc?'none':'block';
  document.getElementById('todoBar').style.display=svc?'none':'flex';
  document.getElementById('mSvc').classList.toggle('active',svc);
  document.getElementById('mTodo').classList.toggle('active',!svc);
  if(!svc) tbRender();
}

/* ============ 字級 ============ */
const FS_KEY="angie_fontscale";
function setFS(v,save){
  document.documentElement.style.zoom = v;
  if(save!==false) localStorage.setItem(FS_KEY,v);
  document.querySelectorAll(".fsbar button").forEach(b=>

function dataSheet(){

function snapshot(){
  const data={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); data[k]=localStorage.getItem(k); }
  return {app:"馥芸工作台", version:1, savedAt:new Date().toISOString(), from:location.href, data};
}
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes());
}
function dl(obj,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function describe(data){
  let todo=0,svc=0;
  try{ const t=JSON.parse(data["angie_todo_v1"]||"[]"); t.forEach(x=>todo+=(x.tasks||[]).length); }catch(e){}
  try{ svc=(JSON.parse(data["angie_service_v3"]||"[]")||[]).length; }catch(e){}
  return {todo,svc,keys:Object.keys(data).length};
}

function restorePick(){

document.getElementById("bkFile").addEventListener("change",function(ev){
  const f=ev.target.files[0]; ev.target.value="";
  if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    let snap;
    try{ snap=JSON.parse(rd.result); }catch(e){ return alert("讀不到內容，這個檔案可能不是備份檔。"); }
    const data=snap && snap.data ? snap.data : snap;
    if(!data || typeof data!=="object" || !Object.keys(data).length) return alert("這個檔案裡沒有可還原的資料。");
    const n=describe(data);

    const cur=describe(snapshot().data);
    if(!confirm("備份檔內容：\n　建立時間："+when+"\n　待辦 "+n.todo+" 項　保服 "+n.svc+" 項\n\n目前畫面上：\n　待辦 "+cur.todo+" 項　保服 "+cur.svc+" 項\n\n確定用備份檔覆蓋現在的資料？")) return;
    try{ dl(snapshot(),"還原前自動備份_"+stamp()+".json"); }catch(e){}
    try{

    }catch(e){ alert("還原失敗："+e.message); }
  };
  rd.readAsText(f);
});

const PEND_KEY="angie_pending_v1";
function getPending(){ try{return new Set(JSON.parse(localStorage.getItem(PEND_KEY)||"[]"));}catch(e){return new Set();} }
function savePending(set){ try{localStorage.setItem(PEND_KEY,JSON.stringify([...set]));}catch(e){} }
function markPending(id){ const s=getPending(); s.add(String(id)); savePending(s); updatePendBadge(); }
function clearPending(id){ const s=getPending(); s.delete(String(id)); savePending(s); updatePendBadge(); }
function updatePendBadge(){
  const n=getPending().size, el=document.getElementById("pendBadge");
  if(!el)return;
  if(n>0){ el.style.display="inline-flex"; el.textContent="⚠ "+n+" 筆未上傳"; }

async function pull(){
  if(!WEBAPP_URL){setSync("","本機模式");return;}
  setSync("busy","同步中…");
  try{ const r=await fetch(WEBAPP_URL,{method:"GET"}); const j=await r.json();
    if(j.ok){
      if(j.items&&j.items.length){
        // 覆蓋前先留一份快照，萬一不對可還原
        try{ localStorage.setItem("angie_prepull_backup",JSON.stringify({at:new Date().toISOString(),items:items})); }catch(e){}
        const pend=getPending();
        const localById={}; items.forEach(i=>localById[String(i.id)]=i);
        const merged=j.items.map(normalize).map(function(cloudIt){
          // 本機有還沒上傳的修改 → 本機優先，不讓雲端蓋掉
          if(pend.has(String(cloudIt.id)) && localById[String(cloudIt.id)]) return localById[String(cloudIt.id)];
          return cloudIt;
        });
        // 本機有、雲端沒有的（新增後沒上傳成功）也要保留
        const cloudIds=new Set(merged.map(i=>String(i.id)));
        items.forEach(function(li){ if(!cloudIds.has(String(li.id)) && pend.has(String(li.id))) merged.push(li); });
        items=merged;
        // 把未上傳的補送上去
        for(const id of [...pend]){ const it=find(id); if(it) await push(it); }
      } else { await pushAll(); }
      saveCache(); render(); updatePendBadge();
      setSync(getPending().size?"off":"ok", getPending().size?"部分未上傳":"已同步");
    } else throw 0;
  }catch(e){ setSync("off","離線·用本機"); updatePendBadge(); }
}
function restorePrePull(){
  try{
    const raw=localStorage.getItem("angie_prepull_backup");
    if(!raw){ alert("沒有可還原的快照。"); return; }
    const snap=JSON.parse(raw);
    const t=new Date(snap.at).toLocaleString("zh-TW");
    if(!confirm("要還原到同步前的狀態嗎？\n\n快照時間："+t+"\n筆數："+snap.items.length+"（目前 "+items.length+" 筆）\n\n還原後這些資料會重新上傳到雲端。")) return;
    items=snap.items; saveCache(); render();
    const s=getPending(); items.forEach(i=>s.add(String(i.id))); savePending(s); updatePendBadge();
    pushAll(); showToast("已還原並重新上傳");
  }catch(e){ alert("還原失敗。"); }
}
function normalize(o){
  const it={category:o.category,id:String(o.id),name:o.name,detail:o.detail,amount:Number(o.amount)||0,stage:Number(o.stage)||0,status:o.status||"",statusText:o.statusText||o.statustext||"",tag:o.tag||"",notes:{}};
  try{ if(o.notes) it.notes=typeof o.notes==="string"?JSON.parse(o.notes):o.notes; }catch(e){ it.notes={}; }
  if(o.category==="due") it.due=!!Number(o.done); else it.done=!!Number(o.done);
  return it;
}
function payload(it){ return {category:it.category,id:it.id,name:it.name,detail:it.detail||"",amount:it.amount||0,done:(it.category==="due"?(it.due?1:0):(it.done?1:0)),stage:it.stage||0,status:it.status||"",statusText:it.statusText||"",tag:it.tag||"",notes:JSON.stringify(it.notes||{})}; }
async function push(it){
  if(!WEBAPP_URL)return;
  setSync("busy","儲存中…");
  try{
    await fetch(WEBAPP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"upsert",item:payload(it)})});
    clearPending(it.id);
    setSync(getPending().size?"off":"ok", getPending().size?"部分未上傳":"已同步");
  }catch(e){
    markPending(it.id);
    setSync("off","未上傳·已存本機");
  }
}

async function pushAll(){ for(const it of items){ await push(it); } }
async function pushDelete(id){ if(!WEBAPP_URL)return; try{ await fetch(WEBAPP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"delete",id})}); setSync("ok","已同步"); }catch(e){ setSync("off","離線·用本機"); } }

function isFlow(cat){ return !!SECTIONS[cat].steps; }
function openCount(cat){ const list=byCat(cat); if(cat==="due")return list.filter(i=>!i.due).length; if(isFlow(cat))return list.filter(i=>(i.stage||0)<SECTIONS[cat].steps.length).length; return list.filter(i=>!i.done).length; }

function simpleCard(it){
  const isDue=it.category==="due", done=isDue?it.due:it.done;

  else if(it.statusText){ meta='<div class="meta"><span class="pill '+(it.status||"wait")+'">'+it.statusText+'</span></div>'; }

function editMemo(id){ const it=find(id); if(!it)return; if(!it.notes)it.notes={}; const v=prompt("備註／工作記錄：",it.notes.memo||""); if(v===null)return; if(v.trim()==="")delete it.notes.memo; else it.notes.memo=v.trim(); saveCache(); render(); push(it); }
function flowCard(it){
  const steps=SECTIONS[it.category].steps, stage=it.stage||0, complete=stage>=steps.length, notes=it.notes||{};
  const card=document.createElement("div"); card.className="rcard"+(complete?" complete":"");

  sh+='</div>';

  steps.forEach((label,i)=>{const n=i+1;const cls=n<=stage?"sdone":(n===stage+1?"scur":"");const note=notes[n]||"";nh+='<div class="snrow '+cls+'" data-id="'+it.id+'" data-step="'+n+'"><span class="snlab">'+(n<=stage?"✓":n)+' '+label+'</span><span class="sntxt'+(note?'':' snempty')+'">'+(note?esc(note):'＋ 備註')+'</span></div>';});
  nh+='</div>';
  card.innerHTML='<div class="rhead"><div class="body"><div class="name">'+it.name+'</div><div class="detail">'+(it.detail||"")+'</div><div class="rstat">'+stat+'</div></div><button class="del" data-id="'+it.id+'">×</button></div>'+sh+nh;

  return card;
}
function editNote(id,step){ const it=find(id); if(!it)return; if(!it.notes)it.notes={}; const label=SECTIONS[it.category].steps[step-1]; const v=prompt("第"+step+"步「"+label+"」備註：",it.notes[step]||""); if(v===null)return; if(v.trim()==="")delete it.notes[step]; else it.notes[step]=v.trim(); saveCache(); render(); push(it); }
function setStage(id,step){ const it=find(id); if(!it)return; it.stage=((it.stage||0)===step)?step-1:step; saveCache(); render(); push(it); }
function renderTotals(){ let due=0,paid=0; byCat("due").forEach(it=>{if(it.due)paid+=(it.amount||0);else due+=(it.amount||0);}); document.getElementById("dueNum").innerHTML='<small>NT$</small>'+due.toLocaleString(); document.getElementById("paidNum").innerHTML='<small>NT$</small>'+paid.toLocaleString(); }
function toggle(id){ const it=find(id); if(!it)return; if(it.category==="due")it.due=!it.due; else it.done=!it.done; saveCache(); render(); push(it); }
function removeItem(id){ if(!confirm("刪除這個項目？"))return; items=items.filter(i=>i.id!==id); saveCache(); render(); pushDelete(id); }
function addItem(){ const name=prompt("項目名稱（例：客戶姓名）"); if(!name)return; const detail=prompt("說明（例：商品／內容／到期日）")||""; const it={category:activeTab,id:"x"+Date.now(),name,detail}; if(activeTab==="due"){it.amount=parseInt(prompt("金額（沒有就留空）"))||0;it.due=false;}else if(isFlow(activeTab)){it.stage=1;}else{it.done=false;} items.push(it); saveCache(); render(); push(it); }
function copySummary(){ let out="馥芸財富學苑｜今日保戶服務\n"+new Date().toLocaleDateString("zh-TW")+"\n"; let due=0,paid=0; byCat("due").forEach(it=>{if(it.due)paid+=it.amount||0;else due+=it.amount||0;}); out+="待收 NT$"+due.toLocaleString()+"｜已收 NT$"+paid.toLocaleString()+"\n"; for(const k in SECTIONS){const list=byCat(k);if(!list.length)continue;out+="\n【"+SECTIONS[k].name+"】\n";list.forEach(it=>{if(isFlow(k)){const st=it.stage||0,steps=SECTIONS[k].steps;const tag=st>=steps.length?"✓完成":(st===0?"未開始":"➡ "+steps[st-1]+"後");out+="・"+it.name+"　"+(it.detail||"")+"（"+tag+"）\n";}else{const d=(k==="due"?it.due:it.done);const mark=d?(k==="due"?"✓已收":"✓完成"):"☐";const amt=(k==="due"&&it.amount)?" $"+it.amount.toLocaleString():"";out+=mark+" "+it.name+"　"+(it.detail||"")+amt+"\n";}});} navigator.clipboard.writeText(out).then(()=>showToast("已複製，可貼到 LINE／記事本")).catch(()=>prompt("手動複製：",out)); }
function resetAll(){ if(!confirm("清空所有勾選與項目，回到初始清單？"))return; items=JSON.parse(JSON.stringify(SEED_ITEMS)); saveCache(); render(); if(WEBAPP_URL)pushAll(); showToast("已重設"); }
const LINE_URL="https://lin.ee/pajsB7X";
function openLine(){ window.open(LINE_URL,"_blank"); }

/* ============ 待辦清單（隔離模組）============ */
const TB_KEY="angie_todo_v1";
const TB_SEED=[];  /* 雲端版：不內建任何待辦內容 */

let tbData=tbLoad();
function tbLoad(){ try{const s=localStorage.getItem(TB_KEY);if(s)return JSON.parse(s);}catch(e){} return JSON.parse(JSON.stringify(TB_SEED)); }
function tbSave(){ try{localStorage.setItem(TB_KEY,JSON.stringify(tbData));}catch(e){} }
function tbTheme(id){ return tbData.find(t=>t.id===id); }
function tbRender(){
  const board=document.getElementById("tboard"); board.innerHTML="";
  let total=0,done=0;
  tbData.forEach(theme=>{
    const openN=theme.tasks.filter(t=>!t.done).length;
    total+=theme.tasks.length; done+=theme.tasks.filter(t=>t.done).length;
    const d=document.createElement("details"); d.className="theme"; d.open=theme.open;
    d.addEventListener("toggle",()=>{theme.open=d.open;tbSave();});
    let th='<div class="tasks">';
    theme.tasks.forEach(t=>{ const note=t.note||"";
      th+='<div class="task'+(t.done?" done":"")+'"><div class="chk" data-t="'+theme.id+'" data-k="'+t.id+'">'+(t.done?"✓":"")+'</div><div class="tbody"><div class="txt">'+esc(t.text)+'</div><div class="tnote" data-t="'+theme.id+'" data-k="'+t.id+'">📝 <span class="'+(note?"":"nempty")+'">'+(note?esc(note):"加備註")+'</span></div></div><button class="del" data-t="'+theme.id+'" data-k="'+t.id+'">×</button></div>';
    });
    th+='<button class="addtask" data-t="'+theme.id+'">＋ 新增任務</button></div>';
    d.innerHTML='<summary><span class="tw-ico">'+theme.icon+'</span><span class="tw-name">'+esc(theme.name)+'</span><span class="tw-count'+(openN===0?" zero":"")+'">'+openN+'</span><span class="tw-arrow">▸</span></summary>'+th;
    board.appendChild(d);
  });
  document.getElementById("tProgTxt").textContent=done+" / "+total;
  document.getElementById("tProgFill").style.width=(total?Math.round(done/total*100):0)+"%";
  board.querySelectorAll(".chk").forEach(el=>el.onclick=()=>tbToggle(el.dataset.t,el.dataset.k));
  board.querySelectorAll(".del").forEach(el=>el.onclick=(e)=>{e.stopPropagation();tbDel(el.dataset.t,el.dataset.k);});
  board.querySelectorAll(".addtask").forEach(el=>el.onclick=()=>tbAddTask(el.dataset.t));
  board.querySelectorAll(".tnote").forEach(el=>el.onclick=(e)=>{e.stopPropagation();tbEditNote(el.dataset.t,el.dataset.k);});
}
function tbToggle(tid,kid){ const t=tbTheme(tid).tasks.find(x=>x.id===kid); if(t){t.done=!t.done;tbSave();tbRender();} }
function tbDel(tid,kid){ const th=tbTheme(tid); th.tasks=th.tasks.filter(x=>x.id!==kid); tbSave(); tbRender(); }
function tbAddTask(tid){ const txt=prompt("新增任務："); if(!txt)return; tbTheme(tid).tasks.push({id:"x"+Date.now(),text:txt,done:false}); tbTheme(tid).open=true; tbSave(); tbRender(); }
function tbEditNote(tid,kid){ const t=tbTheme(tid).tasks.find(x=>x.id===kid); if(!t)return; const v=prompt("備註／記錄：",t.note||""); if(v===null)return; if(v.trim()==="")delete t.note; else t.note=v.trim(); tbSave(); tbRender(); }
function tbAddTheme(){ const name=prompt("新主題名稱（例：進修學習）："); if(!name)return; const icon=prompt("主題圖示 emoji（可留空）","📌")||"📌"; tbData.push({id:"th"+Date.now(),icon,name,open:true,tasks:[]}); tbSave(); tbRender(); }
function tbSetAll(open){ tbData.forEach(t=>t.open=open); tbSave(); tbRender(); }
function tbCopyAll(){ let out="芸的待辦清單\n"+new Date().toLocaleDateString("zh-TW")+"\n"; tbData.forEach(t=>{out+="\n"+t.icon+" "+t.name+"\n";t.tasks.forEach(k=>out+=(k.done?"✓ ":"☐ ")+k.text+(k.note?"（"+k.note+"）":"")+"\n");}); navigator.clipboard.writeText(out).then(()=>showToast("已複製清單")).catch(()=>prompt("手動複製：",out)); }
function tbReset(){ if(!confirm("重設待辦清單，清空所有待辦？（雲端版會變成空白）"))return; tbData=JSON.parse(JSON.stringify(TB_SEED)); tbSave(); tbRender(); showToast("待辦已更新"); }

function firstRun(){
  const c=document.getElementById("content");
  c.innerHTML='<div style="background:#fff;border-radius:16px;padding:22px 20px;margin-top:10px;box-shadow:var(--shadow);line-height:1.75;">'
   +'<div style="font-size:20px;font-weight:900;margin-bottom:10px;">這台裝置還沒連結</div>'
   +'<div style="font-size:16px;color:var(--muted);margin-bottom:18px;">這個網頁本身不存任何資料。要看到你的客戶與待辦，先做以下其中一項：</div>'
   +'<button onclick="syncMenu()" style="display:block;width:100%;background:var(--primary);color:#fff;border:none;border-radius:13px;padding:16px;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;margin-bottom:11px;">連結 Google 試算表</button>'
   +'<button onclick="restorePick()" style="display:block;width:100%;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:13px;padding:16px;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;">從備份檔還原</button>'
   +'<div style="font-size:14.5px;color:var(--muted);margin-top:16px;">設定只存在這台裝置，換裝置要再設一次。</div></div>';
}

  searchQuery=this.value.trim();

  render();
