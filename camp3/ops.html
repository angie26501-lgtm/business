function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function dec(pw){var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},key,b(P.c)))}
async function open_(pw,rem){var html=await dec(pw);try{sessionStorage.setItem(K,pw)}catch(e){}try{if(rem)localStorage.setItem(K,JSON.stringify({pw:pw,exp:Date.now()+30*DAY}))}catch(e){}document.open();document.write(html);document.close()}
document.getElementById("sw").onchange=function(){if(this.value)location.href=this.value};
document.getElementById("eye").onclick=function(){var p=document.getElementById("pw");p.type=p.type==="password"?"text":"password";this.textContent=p.type==="password"?"顯示":"隱藏"};
document.getElementById("agree").onchange=function(){document.getElementById("go").disabled=!this.checked};
async function go(){var e=document.getElementById("err");e.textContent="解鎖中…";try{await open_(document.getElementById("pw").value.trim(),document.getElementById("rem").checked)}catch(x){e.textContent="通行碼不正確，請再試一次。"}}
document.getElementById("go").onclick=go;document.getElementById("pw").onkeydown=function(ev){if(ev.key==="Enter"&&!document.getElementById("go").disabled)go()};
(async function(){var c=[];try{var s=sessionStorage.getItem(K);if(s)c.push(s)}catch(e){}try{var l=JSON.parse(localStorage.getItem(K)||"null");if(l&&l.exp>Date.now())c.push(l.pw);else if(l)localStorage.removeItem(K)}catch(e){}
 for(var i=0;i<c.length;i++){try{await open_(c[i],false);return}catch(e){}}})();
