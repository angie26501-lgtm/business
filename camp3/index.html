<script>
(function(){
var D=function(x){return new Date(x+'+08:00')};
var $=function(s){return document.querySelector(s)};
var P=[[D('2026-12-14T20:00:00'),'🌱 三日營 12/14（一）晚上 8 點開營倒數',D('2026-12-14T20:00:00')],[D('2026-12-17T00:00:00'),'🔥 三日營進行中・距離本梯結束',D('2026-12-17T00:00:00')],[D('2026-12-27T00:00:00'),'📒 五日實踐營 12/27（日）開營倒數',D('2026-12-27T00:00:00')]];
var p2=function(n){return (n<10?'0':'')+n};
function tick(){var now=Date.now(),c=null;for(var i=0;i<P.length;i++)if(now<P[i][0].getTime()){c=P[i];break}
 if(!c){$('#cd').style.display='none';return}var ms=Math.max(0,c[2]-now);$('#cdT').textContent=c[1];
 $('#cdD').textContent=Math.floor(ms/864e5);$('#cdH').textContent=p2(Math.floor(ms%864e5/36e5));$('#cdM').textContent=p2(Math.floor(ms%36e5/6e4));$('#cdS').textContent=p2(Math.floor(ms%6e4/1e3))}
tick();setInterval(tick,1000);
})();
</script>
