<script>
const form = document.getElementById("activityForm");
const nums = [...document.querySelectorAll(".num")];

// 🔥 防呆數字
function n(name){
  const val = Number(form[name].value || 0);
  return val < 0 ? 0 : val;
}

// 🔥 百分比
function pct(a,b){
  if(!b || b === 0) return "0%";
  return Math.round((a/b)*100) + "%";
}

// 🔥 核心計算（優化版）
function updateStats(){

  const call = n("call");
  const apo = n("apo");
  const ff  = n("ff");
  const pd  = n("pd");
  const c   = n("c");
  const s   = n("s");
  const r   = n("r");
  const policy = n("policy");

  // 👉 總活動量（核心KPI）
  const total = call + apo + ff + pd + c + s + r + policy;

  // 👉 更新畫面
  document.getElementById("totalScore").textContent = total;

  // 👉 轉換率
  document.getElementById("rateCallApo").textContent = pct(apo, call);
  document.getElementById("ratePdC").textContent = pct(c, pd);
}

// 🔥 即時監聽（更順）
nums.forEach(el => {
  el.addEventListener("input", updateStats);
  el.addEventListener("change", updateStats);
});

// 🔥 初始化
updateStats();
</script>
