const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let key=null;
const opts=[{id:'home',title:'📋 總目錄'}].concat(D.items.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>({id:i.id,title:i.date+'｜'+i.title})));
for(const s of [pick,nav]) s.innerHTML=opts.map(o=>`<option value="${o.id}">${o.title}</option>`).join('');
async function derive(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);}
async function dec(it){const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(it.iv)},key,b64(it.ct));return new TextDecoder().decode(p);}
async function show(id){nav.value=id;location.hash=id;
 if(id==='home'){view.innerHTML='<div class="list">'+D.items.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(i=>`<div class="card" data-id="${i.id}"><small>${i.cat}</small>${i.date}｜${i.title}</div>`).join('')+'</div>';
  view.querySelectorAll('.card').forEach(c=>c.onclick=()=>show(c.dataset.id));return;}
 const it=D.items.find(x=>x.id===id); view.innerHTML='<main>'+await dec(it)+'</main>'; scrollTo(0,0);}
async function login(pw,remember){try{key=await derive(pw);await dec(D.items[0]);}catch(e){key=null;return false;}
 if(remember){try{localStorage.setItem(K,JSON.stringify({pw,exp:Date.now()+30*DAY}))}catch(e){}}
 login_.style.display='none';app.style.display='block';return true;}
const login_=document.getElementById('login');
go.onclick=async()=>{msg.textContent='驗證中…';if(await login(pw.value,true)){show(pick.value)}else msg.textContent='密碼不正確'};
