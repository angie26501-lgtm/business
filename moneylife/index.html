:root{--bg:#f6f7f2;--paper:#fff;--ink:#2b2f26;--muted:#6b705f;--line:#e3e6d8;--brand:#8fb52a;--dk:#56701a;--err:#c4473a}

*{box-sizing:border-box}

.f{position:relative}

.err{color:var(--err);font-size:14px;min-height:1.4em}
.tip{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 12px;line-height:1.6}
