.tip{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 12px;line-height:1.6}

var K="yun_cohort_gate",DAY=864e5;
function b(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function save(pw,remember){
  try{sessionStorage.setItem(K,pw)}catch(e){}
  try{if(remember)localStorage.setItem(K,JSON.stringify({pw:pw,exp:Date.now()+30*DAY}))}catch(e){}
}
function stored(){
  var out=[];
  try{var s=sessionStorage.getItem(K);if(s)out.push(s)}catch(e){}
  try{var l=JSON.parse(localStorage.getItem(K)||"null");if(l&&l.exp>Date.now())out.push(l.pw);else if(l)localStorage.removeItem(K)}catch(e){}
  return out;
}
async function slot(pw,sl){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(sl.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(sl.i)},key,b(sl.k))));
}
async function open_(pw,remember){
  var info=null;
  for(var j=0;j<P.slots.length;j++){try{info=await slot(pw,P.slots[j]);break}catch(e){}}
  if(!info)throw new Error("bad");
  var key=await crypto.subtle.importKey("raw",b(info.k),{name:"AES-GCM"},false,["decrypt"]);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.i)},key,b(P.c)));
  save(pw,remember);
  var who=JSON.stringify(info.who||""),role=JSON.stringify(info.role||"helper");
  var head='<meta name="robots" content="noindex, nofollow, noarchive"><script>window.__ROLE='+role+';window.__WHO='+who+';<\/script>';
  var bar='<button type="button" id="fy-logout" style="position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:9999;font:14px/1 sans-serif;padding:8px 14px;border-radius:999px;border:1px solid #8fb52a;background:#2b2f26;color:#fff;cursor:pointer;opacity:.85">登出</button><script>document.getElementById("fy-logout").addEventListener("click",function(){try{sessionStorage.removeItem("'+K+'")}catch(e){}try{localStorage.removeItem("'+K+'")}catch(e){}location.reload()});<\/script><style>@media print{#fy-logout{display:none!important}}</style>';
  html=html.replace("<head>","<head>"+head).replace("</body>",bar+"</body>");
  document.open();document.write(html);document.close();
}
document.getElementById("eye").addEventListener("click",function(){
  var i=document.getElementById("pw"),show=i.type==="password";i.type=show?"text":"password";this.textContent=show?"隱藏":"顯示";i.focus();
});
document.getElementById("g").addEventListener("submit",function(ev){
  ev.preventDefault();var e=document.getElementById("e");
  if(!document.getElementById("cs").checked){e.textContent="請先閱讀並勾選同意「使用說明與個人資料告知」。";return}
  if(!window.crypto||!crypto.subtle){e.textContent="這個瀏覽器無法解鎖，請改用 Chrome 或 Safari 開啟。";return}
  e.textContent="解鎖中…";
  open_(document.getElementById("pw").value.trim(),document.getElementById("rm").checked).catch(function(){e.textContent="通行碼不正確，請再試一次（注意大小寫）。"});
});
(async function(){var c=stored();for(var i=0;i<c.length;i++){try{await open_(c[i],false);return}catch(e){}}})();
