<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>財務健康自我檢視｜金錢好生活・芸琪共學圈</title>
<style>
:root{--g:#2f6b3a;--g2:#8fb52a;--bg:#fbf7ee;--card:#fff;--tx:#2b2b2b;--mu:#6b6b6b;--gold:#d6aa46}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
.top button{border:1px solid #cfdcb5;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--g);cursor:pointer}
h1{font-size:23px;color:var(--g);margin:14px 0 4px;line-height:1.35}
.sub{color:var(--mu);font-size:14px;margin:0 0 16px}
.q{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid #e6e0cf;border-radius:14px;padding:14px;margin:10px 0;cursor:pointer;font-size:17px;line-height:1.5;transition:.15s}
.q .c{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid #b9b19a;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;margin-top:1px}
.q.on{border-color:var(--g2);background:#f4f9e8}.q.on .c{background:var(--g2);border-color:var(--g2)}
.bar{height:10px;background:#e9e3d2;border-radius:99px;overflow:hidden;margin:18px 0 6px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g2),var(--g));transition:.3s}
.cnt{font-size:15px;color:var(--g);font-weight:700}
.res{background:#fff;border-left:5px solid var(--gold);border-radius:10px;padding:14px;margin-top:12px;font-size:16px;line-height:1.6}
.cta{background:var(--g);color:#fff;border-radius:14px;padding:16px;margin-top:16px;font-size:16px;line-height:1.6;text-align:center}
.cta b{color:#f3d68c}
.note{font-size:12px;color:var(--mu);margin-top:14px;line-height:1.5}
</style></head><body><div class="wrap">
<div class="top"><span>🌱 金錢好生活・芸琪共學圈 DAY3</span><button id="reset">↻ 重新整理</button></div>
<h1>你的財務體質，<br>經得起這五個問題嗎？</h1>
<p class="sub">能清楚回答的，就點一下打勾。不用公開數字，誠實問自己就好。</p>
<div id="list"></div>
<div class="bar"><i id="fill"></i></div>
<div class="cnt" id="cnt">已確認 0 / 5 題</div>
<div class="res" id="res">先點點看，你能清楚回答幾題？</div>
<div class="cta">回到群組，留言你的題數（0～5）💬<br>想進一步看懂自己的財務體質，留言「<b>健檢</b>」，芸琪陪你一步一步看 🌱</div>
<p class="note">這是自我覺察清單，不是經過驗證的財務健康評分工具，也不是投資或保險建議。<br>——財顧芸｜家族傳承生活顧問</p>
</div>
<script>
var Q=["我知道家庭每個月真正的收入、支出與結餘","我清楚自己有多少資產、負債和隨時能動用的資金","如果收入暫時中斷，我知道現有資源可以支撐多久","我知道現有的保障與投資，可能有哪些風險","我知道現在的財務安排，是否足以支持未來想過的生活"];
var R=["沒關係，知道自己從哪裡開始，就是最重要的第一步 🌱","已經開始有方向了！挑一題最在意的，這週先弄清楚它。","一半以上都清楚，很棒！剩下的幾題，就是下一步可以整理的地方。","你對自己的財務很有掌握 👍 可以再看看細節，是不是真的支持你想過的生活。"];
var on=[0,0,0,0,0], L=document.getElementById("list");
function draw(){L.innerHTML=Q.map(function(t,i){return '<div class="q'+(on[i]?' on':'')+'" data-i="'+i+'"><span class="c">'+(on[i]?'✓':'')+'</span><span>'+t+'</span></div>';}).join("");
 var n=on.reduce(function(a,b){return a+b},0); document.getElementById("fill").style.width=(n*20)+"%"; document.getElementById("cnt").textContent="已確認 "+n+" / 5 題";
 document.getElementById("res").textContent=n===0?"先點點看，你能清楚回答幾題？":(n<=1?R[0]:n<=2?R[1]:n<=4?R[2]:R[3]);}
L.addEventListener("click",function(e){var q=e.target.closest(".q"); if(!q)return; on[+q.dataset.i]^=1; draw();});
document.getElementById("reset").onclick=function(){on=[0,0,0,0,0];draw();window.scrollTo(0,0);};
["contextmenu","copy","cut","paste","selectstart"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();});});
draw();
</script></body></html>
