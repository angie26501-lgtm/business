```html
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YL美單接龍訂購</title>

<style>
body{
  margin:0;
  font-family:"Microsoft JhengHei",sans-serif;
  background:#f6f4ee;
  padding-bottom:180px;
}
.wrap{max-width:680px;margin:auto;padding:16px}
.hero{
  background:linear-gradient(135deg,#3f5f45,#5f7f5f);
  color:white;
  padding:20px;
  border-radius:20px;
}
.section{
  background:white;
  margin-top:14px;
  padding:14px;
  border-radius:16px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}
input,select,textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-top:6px;
}
.product{
  border:1px solid #eee;
  border-radius:12px;
  padding:10px;
  margin-bottom:8px;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.summary{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:12px;
  border-top:2px solid #ddd;
}
button{
  width:100%;
  padding:14px;
  background:#c8a978;
  border:none;
  border-radius:12px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="wrap">
<div class="hero">
<h2>🌿 YL美單接龍訂購</h2>
<p>填寫後我們會依序確認訂單</p>
</div>

<form id="form"
action="https://docs.google.com/forms/d/e/1FAIpQLSfM46IIgyNwNR-mSkk8k1K4h3cbVMA22vuF_piPZvVPtjC4kw/formResponse"
method="POST"
target="hidden_iframe">

<div class="section">

名字
<input name="entry.2061640866" required>

聯絡方式
<input name="entry.1056863373" required>

Email
<input name="emailAddress">

<select name="entry.1510799457" required>
<option value="">是否願意等待</option>
<option value="✅ 可以等">可以等</option>
<option value="❌ 想先購">想先購</option>
</select>

<input type="hidden" name="entry.1950925140" value="明白">

</div>

<div class="section">
<h3>商品</h3>
<div id="products"></div>
</div>

<div class="section">
<h3>其他單品</h3>
<textarea name="entry.1922080120"></textarea>
</div>

<div class="section">
<label><input type="checkbox" required>不可取消</label><br>
<label><input type="checkbox" required name="entry.962325365" value="1">匯款回報</label><br>
<label><input type="checkbox" required name="entry.990721932" value="1">訂單確認</label><br>
<label><input type="checkbox" required name="entry.14570848" value="1">依群組規則</label>
</div>

<button>送出訂單</button>

</form>

<iframe name="hidden_iframe" style="display:none"></iframe>

</div>

<div class="summary">
總金額：<span id="total">0</span>
</div>

<script>
const data=[
["寧夏紅隨手包",4500,"entry.1302584334"],
["防禦套組A",8800,"entry.1477804728"],
["防禦套組B",14440,"entry.639673888"],
["痘痘膏",1112,"entry.235779650"],
["有機枸杞乾",1140,"entry.1002608674"],
["咳嗽三寶",2910,"entry.1432145142"],
["咳嗽膏",null,"entry.1337767647"],
["潤喉糖白",920,"entry.1281542311"],
["潤喉糖黃",850,"entry.226288285"],
["寵物沐浴乳",null,"entry.177948175"],
["超級鎂",1320,"entry.1940726949"],
["Mind Wise",3050,"entry.1527846664"],
["每日健康",5100,"entry.569773321"],
["寧夏勁",1780,"entry.235850156"],
["超強防禦",4140,"entry.764943748"],
["健康防禦",4270,"entry.1666360742"],
["黑薑",null,"entry.1410644875"],
["維他命B",910,"entry.739442878"],
["痠痛膏",1881,"entry.428393057"],
["眼霜",2204,"entry.1183600988"],
["膠原",3002,"entry.2120108876"]
];

let html="";
data.forEach((p,i)=>{
html+=`
<div class="product">
<div class="row">
<b>${p[0]}</b>
<span>${p[1]? "$"+p[1]:"需確認"}</span>
</div>
<input type="number" min="0" value="0" class="qty" data-i="${i}" name="${p[2]}">
</div>`;
});
document.getElementById("products").innerHTML=html;

function calc(){
let total=0;
document.querySelectorAll(".qty").forEach(q=>{
let i=q.dataset.i;
let price=data[i][1];
if(price) total+=price*q.value;
});
document.getElementById("total").innerText=total;
}

document.addEventListener("input",calc);

document.getElementById("form").addEventListener("submit",()=>{
alert("已送出，我們會與你確認");
});
</script>

</body>
</html>
```
