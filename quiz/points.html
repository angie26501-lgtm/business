<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>複習闖關｜查詢我的點數</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:radial-gradient(circle at 20% 0%,#fbfaf0,#f1efdf 60%,#e9e7d2);color:#33402e;font-size:18px;line-height:1.7;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.hero{background:linear-gradient(135deg,#3e6b3a,#6f9a5f);color:#fff;border-radius:22px;padding:20px;text-align:center}
.hero h1{margin:0;font-size:24px}
.card{background:#fff;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 6px 18px rgba(60,70,40,.1)}
input{font:inherit;font-size:22px;letter-spacing:4px;width:100%;border:2px solid #cfdcc3;border-radius:12px;padding:10px;text-align:center;-webkit-user-select:text;user-select:text}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-size:18px;font-weight:800;border:none;border-radius:14px;padding:12px;margin-top:10px;cursor:pointer}
.g{background:#4f7a4a;color:#fff}.r{background:#e6eddc;color:#3e6b3a}.y{background:#ffe9a8;color:#7a5a20}.l{background:#06C755;color:#fff}
.big{display:flex;gap:10px;margin-top:10px}.big div{flex:1;background:#f6f7f1;border-radius:16px;padding:12px;text-align:center}
.big b{display:block;font-size:34px;color:#3e6b3a;line-height:1.2}.big .av b{color:#c25a6b}
.row{display:flex;justify-content:space-between;border-bottom:1px dashed #dde6d4;padding:8px 0;font-size:17px}
.note{font-size:14px;color:#7d8a72;margin-top:8px}
.foot{text-align:center;font-size:13px;color:#7d8a72;margin-top:20px}
</style></head><body><div class="wrap">
<div class="hero"><div style="font-size:15px">🌱 金錢好生活｜複習闖關</div><h1>⭐ 查詢我的點數</h1><div id="who" style="margin-top:6px;font-weight:800"></div></div>
<div class="card" id="login" style="display:none"><b style="color:#3e6b3a">請輸入你的個人通行碼（6 位數字）</b>
<input id="pw" inputmode="numeric" maxlength="6" placeholder="例如 123456" style="margin-top:10px" onkeydown="if(event.key==='Enter')go()"><button class="btn g" onclick="go()">🔍 查詢點數</button>
<div id="msg" style="color:#c25a6b;min-height:22px;margin-top:6px"></div><a class="btn y" href="guide.html#sform">📝 還沒有通行碼？填報名問卷領取</a></div>
<div id="res" style="display:none">
<div class="card"><b style="color:#3e6b3a;font-size:19px">☁️ 已登記積分（芸琪那邊的紀錄）</b>
<div class="big"><div>累計<b id="tot">–</b>點</div><div>已兌換<b id="red">–</b>點</div><div class="av">可兌換<b id="av">–</b>點</div></div>
<div class="note">要「送出積分登記」後才會列入；芸琪確認截圖或 LINE 後就能兌換抽獎贈品 🎁</div></div>
<div class="card"><b style="color:#3e6b3a;font-size:19px">📱 這支手機上的作答積分</b>
<div class="row"><span>🎯 三日營</span><b id="l3">0 點</b></div><div class="row"><span>🌱 五日營</span><b id="l5">0 點</b></div>
<div class="note" id="hint"></div></div>
<a class="btn g" href="camp3.html">🎯 去三日營闖關／送出積分</a><a class="btn g" href="camp5.html">🌱 去五日營闖關／送出積分</a>
<button class="btn r" onclick="load()">🔄 重新查詢</button><button class="btn r" onclick="logout()">不是我？換一組通行碼</button></div>
<div style="text-align:center;margin-top:16px;font-size:15px">📚 <a href="index.html" style="color:#3e6b3a;font-weight:800">總目錄</a>｜<a href="guide.html" style="color:#3e6b3a;font-weight:800">使用說明</a></div>
<div class="foot"><b style="color:#3e6b3a">《馥芸財富成長計畫》</b><br>🌱 從財務覺醒開始，成為有生活選擇權的家庭財務長。<br>財顧芸 陳芸琪｜家族傳承生活顧問</div></div>
<script>
var U="https://script.google.com/macros/s/AKfycbxeCPFR3rsTa9Y10mRDxVseRfoLuab52mCsb7nEMPxVw818qQGnpUJo_MJQnGPU4GT3LQ/exec",K3="camp3_quiz_v1",K5="camp5_quiz_v2";
function jp(p,cb){var n="p"+Date.now()+Math.floor(Math.random()*99);window[n]=function(d){delete window[n];cb(d)};var q=[];for(var k in p)q.push(k+"="+encodeURIComponent(p[k]));var s=document.createElement("script");s.src=U+"?"+q.join("&")+"&callback="+n;s.onerror=function(){cb(null)};document.body.appendChild(s)}
function me(){try{return JSON.parse(localStorage.getItem("moneylife_quiz_me")||"null")}catch(e){return null}}
function loc(k){try{var s=JSON.parse(localStorage.getItem(k)||"{}"),n=0;for(var x in s)if(/^p_/.test(x))n+=s[x];return n}catch(e){return 0}}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function show(){var m=me();if(m&&m.id){document.getElementById("who").innerHTML="🎫 編號 "+esc(m.id)+"｜"+esc(m.n);document.getElementById("login").style.display="none";document.getElementById("res").style.display="block";load()}else{document.getElementById("who").textContent="";document.getElementById("login").style.display="block";document.getElementById("res").style.display="none"}}
function load(){var m=me();["tot","red","av"].forEach(function(i){document.getElementById(i).textContent="…"});
 var l3=loc(K3),l5=loc(K5);document.getElementById("l3").textContent=l3+" 點";document.getElementById("l5").textContent=l5+" 點";
 jp({action:"me",id:m.id},function(d){if(d&&d.ok){document.getElementById("tot").textContent=d.total;document.getElementById("red").textContent=d.redeemed;document.getElementById("av").textContent=d.available;
  document.getElementById("hint").textContent=(l3+l5)>d.total?"💡 手機上的積分比已登記的多，記得到闖關頁最下面「送出積分登記」，才會算進去喔！":"✅ 手機上的積分都已經登記了"}else{["tot","red","av"].forEach(function(i){document.getElementById(i).textContent="?"});document.getElementById("hint").textContent="連線不穩，請稍後按「重新查詢」"}})}
function go(){var c=document.getElementById("pw").value.replace(/\D/g,""),m=document.getElementById("msg");if(c.length!==6){m.textContent="請輸入 6 位數字";return}m.textContent="查詢中…";
 jp({action:"login",code:c,camp:""},function(d){if(d&&d.ok){try{localStorage.setItem("moneylife_quiz_me",JSON.stringify({n:d.nick,t:"",id:d.id}))}catch(e){}m.textContent="";show()}else m.textContent=d?"通行碼不對，再試一次 🙏":"連線不穩，請稍後再試"})}
function logout(){try{localStorage.removeItem("moneylife_quiz_me")}catch(e){}show()}
["copy","cut","contextmenu","selectstart"].forEach(function(ev){document.addEventListener(ev,function(e){if(e.target&&e.target.tagName==="INPUT")return;e.preventDefault()})});
show();
</script></body></html>
