function maxPts(){var n=0;STAGES.forEach(function(s){n+=s.poll?10:s.q.length*10});return n}
function badge(p){var m=maxPts();return p>=m?"🏆 財務長":p>=m*.7?"🌳 大樹":p>=m*.4?"🌿 小樹苗":p>0?"🌱 綠芽":"🫘 種子"}
function head(){var ml=document.getElementById("meline"),mm=me();if(ml)ml.innerHTML=mm&&mm.id?"🎫 編號 <b style=\"color:#ffe9a8\">"+esc(mm.id)+"</b>｜"+esc(mm.n):"🎫 尚未登記編號";var p=total();document.getElementById("pt").textContent=p;document.getElementById("pbar").style.width=Math.min(100,p/maxPts()*100)+"%";document.getElementById("bd").textContent=badge(p)+"｜滿分 "+maxPts()}
function sp(s){var n=0;s.q.forEach(function(_,i){n+=S["p_"+s.id+"_"+i]||0});return n}
function home(){cur=null;head();cloud();var h=loginBox()+'<div class="rule">📌 規則：先登記領取夥伴編號 → 闖關賺積分 → 到頁面最下方截圖並「送出積分登記」，確認後可兌換抽獎活動贈品（兌換方式見群組公告）。每題第一次就答對 <b>+10 點</b>，第二次答對 <b>+5 點</b>。</div>';
 STAGES.forEach(function(s,i){var mx=s.poll?10:s.q.length*10,got=sp(s),dn=s.q.every(function(_,j){return S["d_"+s.id+"_"+j]});
  h+='<button class="stage'+(dn?' done':'')+'" onclick="go('+i+')"><span class="d"><big>'+(dn?'✓':s.day.replace("Day ",""))+'</big>'+(s.poll?'':'Day')+'</span><span class="t"><b>'+s.t+'</b><span>'+s.s+'｜'+s.q.length+' 題</span></span><span class="s">'+got+'/'+mx+'</span></button>'});
 var p=total(),txt="我在「金錢整理五日營｜復習闖關」拿到 "+p+" 點，等級："+badge(p)+" 🌱";
 h+=submitBox();h+='<div class="nav"><a class="btn l" target="_blank" rel="noopener" href="https://line.me/R/msg/text/?'+encodeURIComponent(txt)+'">💬 用 LINE 回報我的點數</a></div>';
 document.getElementById("view").innerHTML=h;window.scrollTo(0,0)}
function go(i){cur=STAGES[i];qi=0;mkOrd();show()}
function mkOrd(){ord=cur.q.map(function(q){var a=q[1].map(function(_,j){return j});if(!cur.poll)for(var x=a.length-1;x>0;x--){var y=Math.floor(Math.random()*(x+1));var t=a[x];a[x]=a[y];a[y]=t}return a})}
function show(){var q=cur.q[qi],k=cur.id+"_"+qi,tries=0;
 var h='<div class="card"><div class="qn">'+cur.day+'｜'+cur.t+'　第 '+(qi+1)+' / '+cur.q.length+' 題</div><div class="dots">'+cur.q.map(function(_,j){return '<i class="'+(j===qi?'on':(S["d_"+cur.id+"_"+j]?'ok':''))+'"></i>'}).join("")+'</div><div class="q">'+q[0]+'</div>';
 ord[qi].forEach(function(j){h+='<button class="op" data-j="'+j+'">'+q[1][j]+'</button>'});
 h+='<button class="btn p" id="okb" style="width:100%;margin-top:6px">✅ 確認答案</button><div style="font-size:13px;color:#8a9a80;text-align:center;margin-top:4px">點選答案後按確認；再點一次同一個選項可以取消</div><div class="ex" id="ex"></div><div class="nav"><button class="btn r" onclick="'+(qi>0?'qi--;show()':'home()')+'">← '+(qi>0?'上一題':'回關卡')+'</button><button class="btn g" onclick="nx()">'+(qi<cur.q.length-1?'下一題 →':'完成這關 ✓')+'</button></div></div>';
 document.getElementById("view").innerHTML=h;window.scrollTo(0,0);
 var ex=document.getElementById("ex");
 if(S["d_"+k]){ex.style.display="block";document.getElementById("okb").style.display="none";ex.innerHTML=cur.poll?pollTxt(S["c_"+k]):'✅ 這題已經完成了！<br>'+q[3];document.querySelectorAll(".op").forEach(function(b){b.disabled=true;if(+b.dataset.j===(cur.poll?S["c_"+k]:q[2]))b.classList.add("ok")});return}
 var selB=null;document.getElementById("okb").onclick=function(){if(!selB){toast("請先點選一個答案");return}var b=selB;selB.classList.remove("sel");selB=null;answer(b,+b.dataset.j)};
 document.querySelectorAll(".op").forEach(function(b){b.onclick=function(){if(b.classList.contains("sel")){b.classList.remove("sel");selB=null;return}document.querySelectorAll(".op.sel").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");selB=b}});
 function answer(b,j){
  if(cur.poll){S["c_"+k]=j;S["d_"+k]=1;S["p_"+k]=10;sv();send(cur.id,qi,10);b.classList.add("ok");fly(10);lock();ex.style.display="block";ex.innerHTML=pollTxt(j);head();return}
  tries++;if(j===q[2]){var g=tries===1?10:tries===2?5:0;S["p_"+k]=g;S["d_"+k]=1;sv();send(cur.id,qi,g);b.classList.add("ok");if(g)fly(g);lock();ex.style.display="block";ex.innerHTML='🎉 答對了！'+(g?'+'+g+' 點':'')+'<br>'+q[3];head()}
  else{b.classList.add("ng","shake");setTimeout(function(){b.classList.remove("ng","shake")},900);var left=tries===1?"再答對可得 5 點":"這題答對不加分，但一樣可以看解說";toast("不是這個喔～再想想看！"+left)}}}
function pollTxt(j){return '你選了：<b>'+["A","B","C","D"][j]+'｜'+POLL[j][0]+'</b><br>'+POLL[j][1]+'<br>沒有標準答案，記得到群組留言說說你為什麼這樣選 💛'}
function lock(){document.querySelectorAll(".op").forEach(function(b){b.disabled=true});var o=document.getElementById("okb");if(o)o.style.display="none"}
function nx(){if(qi<cur.q.length-1){qi++;show()}else{toast("🎉 完成「"+cur.t+"」！");home()}}
function refreshMenu(){if(cur){mkOrd();show();toast("選項順序已重新整理")}else{home();toast("選單已重新整理")}}
function fly(n){var e=document.createElement("div");e.className="fly";e.textContent="+"+n+" ⭐";document.body.appendChild(e);setTimeout(function(){e.remove()},1000)}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},1300)}
["copy","cut","paste","contextmenu","selectstart","dragstart"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault()})});
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&/^[acvxsup]$/i.test(e.key))e.preventDefault()});
ld();syncAll();home();
</script></body></html>
