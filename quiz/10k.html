<script>
var OPT={
 A:{c:"#5b8fc9",t:"全部存起來，增加安全感。",ic:"🛡️",name:"安全感守護型",
   good:["做事穩健，不輕易冒險","有存錢習慣，遇到意外比較不慌"],
   tip:["先算算：緊急預備金（大約 3～6 個月生活費）夠了嗎？","夠了之後，可以想想：多出來的錢，要不要給它一個目標？","錢放著很安心，但也記得通膨會慢慢吃掉購買力"]},
 B:{c:"#e0a340",t:"拿去投資，希望累積更多資產。",ic:"📈",name:"成長累積型",
   good:["有讓錢工作的意識","願意為未來的目標提早布局"],
   tip:["投資前先確認：生活費和緊急預備金已經安排好了嗎？","了解自己能承受多大的波動，市場下跌時才不慌","長期投資需要計畫，也需要定期檢視"]},
 C:{c:"#c25a6b",t:"買一件期待很久的東西，犒賞自己。",ic:"🎁",name:"生活享受型",
   good:["懂得照顧自己的心情","知道錢是用來支持想要的生活"],
   tip:["犒賞自己很好！先確認必要支出和存款已經顧到","可以準備一個「享受帳戶」，花得開心又不心虛","問問自己：這件東西，會帶給我多久的快樂？"]},

   good:["懂得分配，兼顧現在與未來","已經有「分帳戶」管理的概念"],

function draw(){
 document.getElementById("opts").innerHTML=order.map(function(k){var o=OPT[k];

}
function choose(k){
 pick=k;draw();var o=OPT[k],r=document.getElementById("res");
 r.innerHTML='<span class="ic">'+o.ic+'</span><span class="tag" style="background:'+o.c+'">你選了 '+k+'</span><h2>'+o.name+'</h2>'+

  '<button class="btn r" onclick="resetMenu()">🔄 重新選一次</button></div>'+
  '<div class="note">回到群組或貼文留言：「我選 '+k+'」，也說說為什麼喔 💛</div>';
 r.style.display="block";setTimeout(function(){r.scrollIntoView({behavior:"smooth",block:"start"})},50);
 try{localStorage.setItem("mlife_10k",k)}catch(e){}
}
function resetMenu(){pick=null;order=shuffle(order.slice());draw();document.getElementById("res").style.display="none";window.scrollTo({top:0,behavior:"smooth"});toast("選單已重新整理，選項順序換過囉")}
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},1400)}
["copy","cut","paste","contextmenu","selectstart","dragstart"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault()})});
document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&/^[acvxsup]$/i.test(e.key))e.preventDefault()});
draw();
</script></body></html>
