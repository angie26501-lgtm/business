<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>幫 Angie 換裝｜人生金錢偵探社</title>
<style>
:root{--green:#2f6b4f;--gold:#c89b3c;--ink:#2a2a2a;--line:#e3d7b8;--cream:#fffaf0}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(#eaf6f2,#fff8ea);color:var(--ink)}
header{text-align:center;padding:18px 12px 6px}
header h1{margin:0;font-size:24px;color:var(--green)}
header p{margin:6px 0 0;color:#6b5b3a;font-size:14px}
.back{display:inline-block;margin-top:8px;font-size:13px;color:var(--green)}
.wrap{max-width:1080px;margin:0 auto;padding:10px 12px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.stage{background:#fff;border:2px solid var(--gold);border-radius:18px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.stage canvas{width:100%;height:auto;display:block;border-radius:12px}
.panel{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;cursor:pointer;font:inherit;font-size:14px}
.tab.on{background:var(--green);color:#fff;border-color:var(--green)}
.hint{font-size:13px;color:#7a6a48;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.it{background:#fff;border:2px solid transparent;border-radius:14px;padding:6px 4px;cursor:pointer;text-align:center;font:inherit;font-size:13px;color:var(--ink)}
.it img{width:100%;height:76px;object-fit:contain;display:block}
.it.on{border-color:var(--gold);background:#fff6dc}
.it .sw{height:76px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.row input{flex:1;min-width:140px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;font:inherit}
.btn{border:0;background:var(--green);color:#fff;border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.btn.alt{background:#fff;color:var(--green);border:1px solid var(--green)}
footer{max-width:900px;margin:10px auto 24px;padding:0 12px}
.ipnote{padding:12px 14px;border:1px dashed #c9b88a;border-radius:12px;background:#fffaf0;color:#5b4a2a;font-size:13px;line-height:1.8}
</style>
</head>
<body>
<header>
 <h1>🧢 幫 Angie 換裝</h1>
 <p>挑造型、道具、小配件和夥伴，組出你心中的神探 Angie，還能下載成造型卡！</p>
 <a class="back" href="index.html">← 回財富航海群島</a>
</header>

<div class="wrap">
 <div class="stage"><canvas id="cv" width="720" height="960"></canvas></div>
 <div class="panel">
  <div class="tabs" id="tabs"></div>
  <p class="hint" id="hint"></p>
  <div class="grid" id="grid"></div>
  <div class="row">
   <input id="nick" maxlength="10" placeholder="輸入你的暱稱（選填）">
  </div>
  <div class="row">
   <button class="btn alt" id="rand">🎲 隨機造型</button>
   <button class="btn alt" id="reset">↺ 重新開始</button>
   <button class="btn" id="dl">⬇ 下載我的造型卡</button>
  </div>
 </div>
</div>

<footer>
 <div class="ipnote"><b>©️ 智慧財產權聲明</b><br>本網站所有文章、圖片、影片、角色（多多、胖胖幣、小綠芽）與互動內容，著作權皆屬 <b>人生金錢偵探社／馥芸財富學苑 陳芸琪</b> 所有。歡迎分享；引用時請註明來源出處並加註連結：<a href="https://angie26501-lgtm.github.io/business/money-detective/" target="_blank" rel="noopener">https://angie26501-lgtm.github.io/business/money-detective/</a>。未經書面授權，請勿修改、重製或作商業使用。</div>
</footer>

<script>
const D='img/dress/';
const CAT={
 look:{name:'造型',hint:'選一套造型（帽子＋服裝一起換）',multi:false,items:[
  ['detective','金錢偵探'],['captain','航海船長'],['advisor','專業顧問'],['traveler','生活旅人'],['elegant','典雅風格'],['daily','活力日常']].map(([k,n])=>({k,n,src:D+'t_'+k+'.png'}))},
 prop:{name:'手上道具',hint:'選一樣拿在手上的道具（可再點一次取消）',multi:false,opt:true,items:[
  ['magnifier','放大鏡'],['compass','羅盤'],['scope','望遠鏡'],['checklist','檢核表'],['map','藏寶圖'],['books','財商書']].map(([k,n])=>({k,n,src:D+'p_'+k+'.png'}))},
 acc:{name:'小配件',hint:'最多選 3 樣小配件',multi:3,items:[
  ['glasses','眼鏡'],['scarf','圍巾'],['bow','蝴蝶結'],['pearl','珍珠項鍊'],['bracelet','手鍊'],['bag','側背包'],['camera','相機'],['headphone','耳機']].map(([k,n])=>({k,n,src:D+'a_'+k+'.png'}))},
 pal:{name:'夥伴',hint:'選一位陪你出任務的夥伴（可再點一次取消）',multi:false,opt:true,items:[
  ['parrot','多多'],['coin','胖胖幣'],['sprout','小綠芽'],['corgi','柯基']].map(([k,n])=>({k,n,src:D+'f_'+k+'.png'}))},
 bg:{name:'背景',hint:'選一個出任務的地點',multi:false,items:[
  {k:'harbor',n:'晴天海港',sw:'linear-gradient(#8fd3f4,#e8f8ff 60%,#3d9bd6 61%)'},
  {k:'sunset',n:'夕陽甲板',sw:'linear-gradient(#f9b26b,#ffd9a0 58%,#a46b3c 59%)'},
  {k:'forest',n:'森林小徑',sw:'linear-gradient(#bfe6b0,#eef8df 62%,#c9a46a 63%)'},
  {k:'night',n:'星空航海',sw:'linear-gradient(#1f2a55,#45508a 60%,#20406b 61%)'}]}
};
const ORDER=['look','prop','acc','pal','bg'];
const DEF={look:'detective',prop:'magnifier',acc:['scarf'],pal:'parrot',bg:'harbor'};
let S=JSON.parse(JSON.stringify(DEF)),cur='look';
const IMG={};
function load(src){return IMG[src]||(IMG[src]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src}))}
const find=(c,k)=>CAT[c].items.find(x=>x.k===k);

function tabs(){const t=document.getElementById('tabs');t.innerHTML=ORDER.map(c=>`<button class="tab${c===cur?' on':''}" data-c="${c}">${CAT[c].name}</button>`).join('');
 t.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.c;tabs();grid()})}
function isOn(c,k){return Array.isArray(S[c])?S[c].includes(k):S[c]===k}
function grid(){const C=CAT[cur];document.getElementById('hint').textContent=C.hint;
 const g=document.getElementById('grid');
 g.innerHTML=C.items.map(it=>`<button class="it${isOn(cur,it.k)?' on':''}" data-k="${it.k}">${it.src?`<img src="${it.src}" alt="${it.n}">`:`<div class="sw" style="background:${it.sw}"></div>`}${it.n}</button>`).join('');
 g.querySelectorAll('.it').forEach(b=>b.onclick=()=>pick(cur,b.dataset.k))}
function pick(c,k){const C=CAT[c];
 if(C.multi){const a=S[c];const i=a.indexOf(k);if(i>=0)a.splice(i,1);else{if(a.length>=C.multi)a.shift();a.push(k)}}
 else if(C.opt&&S[c]===k)S[c]=null; else S[c]=k;
 grid();draw()}

function scene(x,k,W,H){const sea=H*.62;let g;
 if(k==='harbor'){g=x.createLinearGradient(0,0,0,sea);g.addColorStop(0,'#7cc8f0');g.addColorStop(1,'#e6f7ff');x.fillStyle=g;x.fillRect(0,0,W,sea);
  x.fillStyle='#fff';[[120,120],[520,90],[600,180]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,34,0,7);x.arc(a+36,b+6,28,0,7);x.arc(a-34,b+8,24,0,7);x.fill()});
  isl(x,W*.72,sea,'#5d9b5a');g=x.createLinearGradient(0,sea,0,H);g.addColorStop(0,'#3d9bd6');g.addColorStop(1,'#1f6aa3');x.fillStyle=g;x.fillRect(0,sea,W,H-sea);waves(x,W,sea,'rgba(255,255,255,.5)')}
 if(k==='sunset'){g=x.createLinearGradient(0,0,0,sea);g.addColorStop(0,'#f28f5c');g.addColorStop(.6,'#ffc98a');g.addColorStop(1,'#ffe7b8');x.fillStyle=g;x.fillRect(0,0,W,sea);
  x.fillStyle='#fff3c4';x.beginPath();x.arc(W*.7,sea-40,60,0,7);x.fill();isl(x,W*.25,sea,'#8a5a4a');
  g=x.createLinearGradient(0,sea,0,H);g.addColorStop(0,'#b77a48');g.addColorStop(1,'#7a4a28');x.fillStyle=g;x.fillRect(0,sea,W,H-sea);
  x.strokeStyle='rgba(60,30,10,.35)';x.lineWidth=3;for(let y=sea+40;y<H;y+=48){x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}}
 if(k==='forest'){g=x.createLinearGradient(0,0,0,sea);g.addColorStop(0,'#a8dcb0');g.addColorStop(1,'#f0f9e4');x.fillStyle=g;x.fillRect(0,0,W,sea);
  for(let i=0;i<7;i++){const a=i*W/6;x.fillStyle=i%2?'#4f8f55':'#6aab62';x.beginPath();x.arc(a,sea-30,90,Math.PI,0);x.fill();x.fillStyle='#7a5532';x.fillRect(a-10,sea-40,20,40)}
  g=x.createLinearGradient(0,sea,0,H);g.addColorStop(0,'#d8b77a');g.addColorStop(1,'#b8925a');x.fillStyle=g;x.fillRect(0,sea,W,H-sea)}
 if(k==='night'){g=x.createLinearGradient(0,0,0,sea);g.addColorStop(0,'#141c40');g.addColorStop(1,'#4a5590');x.fillStyle=g;x.fillRect(0,0,W,sea);
  let s=7;const R=()=>(s=(s*9301+49297)%233280)/233280;x.fillStyle='#fff';for(let i=0;i<70;i++){x.globalAlpha=.4+R()*.6;x.fillRect(R()*W,R()*sea*.9,2,2)}x.globalAlpha=1;
  x.fillStyle='#fff6c8';x.beginPath();x.arc(W*.8,120,40,0,7);x.fill();x.fillStyle='#4a5590';x.beginPath();x.arc(W*.8+16,110,36,0,7);x.fill();
  g=x.createLinearGradient(0,sea,0,H);g.addColorStop(0,'#24477a');g.addColorStop(1,'#0f2648');x.fillStyle=g;x.fillRect(0,sea,W,H-sea);waves(x,W,sea,'rgba(255,255,255,.25)')}}
function isl(x,cx,y,c){x.fillStyle=c;x.beginPath();x.moveTo(cx-130,y);x.quadraticCurveTo(cx-40,y-120,cx+10,y-90);x.quadraticCurveTo(cx+70,y-130,cx+140,y);x.fill()}
function waves(x,W,y,c){x.strokeStyle=c;x.lineWidth=3;for(let r=0;r<4;r++){const yy=y+30+r*60;x.beginPath();for(let a=0;a<=W;a+=40)x.quadraticCurveTo(a+10,yy-8,a+20,yy),x.quadraticCurveTo(a+30,yy+8,a+40,yy);x.stroke()}}
function put(x,im,cx,by,h){if(!im)return;const w=im.width*h/im.height;x.drawImage(im,cx-w/2,by-h,w,h);return w}
function sticker(x,im,cx,cy,r){x.save();x.fillStyle='rgba(255,255,255,.92)';x.strokeStyle='#c89b3c';x.lineWidth=4;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.stroke();
 if(im){const s=Math.min(r*1.45/im.width,r*1.45/im.height);x.drawImage(im,cx-im.width*s/2,cy-im.height*s/2,im.width*s,im.height*s)}x.restore()}

const F='"Noto Sans TC","Microsoft JhengHei",sans-serif';
async function draw(){const cv=document.getElementById('cv'),x=cv.getContext('2d'),W=cv.width,H=cv.height;
 const [look,prop,pal,...acc]=await Promise.all([load(find('look',S.look).src),S.prop?load(find('prop',S.prop).src):null,S.pal?load(find('pal',S.pal).src):null,...S.acc.map(k=>load(find('acc',k).src))]);
 x.clearRect(0,0,W,H);scene(x,S.bg,W,H);
 // 標題
 x.fillStyle='rgba(47,107,79,.92)';rr(x,110,22,500,62,31);x.fill();x.strokeStyle='#e9c46a';x.lineWidth=3;x.stroke();
 x.fillStyle='#fff';x.font=`bold 30px ${F}`;x.textAlign='center';x.fillText('人生金錢偵探社',W/2,64);
 // 地面陰影
 x.fillStyle='rgba(0,0,0,.15)';x.beginPath();x.ellipse(390,842,130,18,0,0,7);x.fill();
 put(x,look,390,846,560);
 if(prop)put(x,prop,560,700,150);
 if(pal){x.fillStyle='rgba(0,0,0,.13)';x.beginPath();x.ellipse(140,862,90,12,0,0,7);x.fill();put(x,pal,140,866,S.pal==='parrot'?190:210)}
 const P=[[96,200],[624,210],[624,380]];acc.forEach((im,i)=>sticker(x,im,P[i][0],P[i][1],62));
 // 名牌
 const nick=(document.getElementById('nick').value||'').trim();const lk=find('look',S.look).n;
 const t=nick?`${nick} 的造型：${lk}`:`我的造型：${lk}`;
 x.font=`bold 30px ${F}`;const tw=Math.min(x.measureText(t).width+60,W-40);
 x.fillStyle='rgba(255,250,240,.95)';rr(x,(W-tw)/2,882,tw,54,27);x.fill();x.strokeStyle='#c89b3c';x.lineWidth=3;x.stroke();
 x.fillStyle='#2f6b4f';x.fillText(t,W/2,920,W-80);
 x.font=`16px ${F}`;x.textAlign='right';x.fillStyle='rgba(255,255,255,.9)';x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=3;
 x.strokeText('© 人生金錢偵探社 Angie',W-14,H-8);x.fillText('© 人生金錢偵探社 Angie',W-14,H-8)}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}

document.getElementById('nick').oninput=draw;
document.getElementById('reset').onclick=()=>{S=JSON.parse(JSON.stringify(DEF));document.getElementById('nick').value='';grid();draw()};
document.getElementById('rand').onclick=()=>{const r=a=>a[Math.floor(Math.random()*a.length)].k;
 S.look=r(CAT.look.items);S.prop=r(CAT.prop.items);S.pal=r(CAT.pal.items);S.bg=r(CAT.bg.items);
 S.acc=CAT.acc.items.map(i=>i.k).sort(()=>Math.random()-.5).slice(0,1+Math.floor(Math.random()*3));grid();draw()};
document.getElementById('dl').onclick=async()=>{await draw();const a=document.createElement('a');a.download='我的偵探造型卡.png';a.href=document.getElementById('cv').toDataURL('image/png');a.click()};
tabs();grid();draw();
</script>
</body>
</html>
