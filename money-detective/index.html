<style>

.lead{font-size:18px;margin:6px 0 12px}
.stats{display:flex;gap:10px;flex-wrap:wrap}

.guidebar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}

.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}
.btn:disabled{opacity:.45;cursor:default}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.lcard{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px;cursor:pointer}
.lcard b{display:block}.lcard small{color:var(--mut)}
.simg{border-radius:12px;overflow:hidden;margin:-4px 0 12px;height:clamp(180px,36vw,380px)}.simg img{width:100%;height:100%;object-fit:cover;display:block}
.lthumb{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:6px;display:block}

.gsteps{font-size:15px;line-height:1.9;padding-left:22px}.kw{background:#2f7f6b;color:#fff;border-radius:6px;padding:1px 8px}
.pform{display:flex;gap:8px;max-width:420px}.pform input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
.gmenu{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ticket{margin-top:10px;border:2px dashed #2f7f6b;border-radius:14px;padding:10px 14px;background:#f1faf5;display:grid;gap:6px;max-width:460px}
.tk-l{font-size:12px;color:#2f7f6b;font-weight:700;letter-spacing:2px}.tk-c{font-size:22px;font-weight:800;color:#1d4e5f}

.fb{margin-top:8px;font-size:14px;min-height:20px}
.stamp{display:inline-block;border:3px solid #c0603f;color:#c0603f;border-radius:10px;padding:2px 10px;font-weight:800;transform:rotate(-6deg)}
.prog{height:8px;background:#e8e1d2;border-radius:4px;overflow:hidden}.prog i{display:block;height:8px;background:var(--green)}
.idx input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:8px}
.idx table{width:100%;border-collapse:collapse;font-size:14px}.idx td{border-top:1px solid var(--line);padding:6px 4px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
footer{text-align:center;color:var(--mut);font-size:12px;padding:24px}
@media(max-width:720px){.hero{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.hero h1{font-size:24px}}

  {q:'保單有一大疊，代表保障一定足夠嗎？',a:['一定足夠','要整理成一張表看缺口'],c:1,why:'張數多不等於保得對。'}]},
 S5:{type:'quiz',title:'解鎖之門：選出能打開門的目標卡',qs:[
  {q:'哪一張是好的財務目標？',a:['我想變有錢','兩年存 20 萬當孩子教育金','以後再說'],c:1,why:'好目標＝金額＋時間＋用途。'},
  {q:'家庭財務會議的第一步是？',a:['先翻舊帳','先談共同目標','直接砍預算'],c:1,why:'先談目標，再看數字，最後分工。'}]},
 S6:{type:'order',title:'五日營掌舵：把五天任務排出正確順序',steps:['全面盤點','支出分類','做預算','設定目標','行動與陪跑']},
 S7:{type:'quiz',title:'遠洋航線情境題',qs:[
  {q:'拿到一筆獎金，預備金只夠 1 個月，最先做什麼？',a:['全部提前還房貸','先補足預備金','全部拿去投資'],c:1,why:'先有救生圈，再談加速。'},
  {q:'投資前要先問自己哪三題？',a:['用途、期間、風險承受度','誰報的明牌','哪支漲最多'],c:0,why:'投資是航線的一部分，不是賭注。'},
  {q:'什麼時候該檢視保單？',a:['買了就不用管','結婚、生子、買房、換工作時','只有理賠時'],c:1,why:'人生階段改變就是檢視時機。'}]},
 S8:{type:'sort',title:'幸福三力配對',bins:['財力','心力','體力'],items:[
  ['每月固定儲蓄',0],['和家人開家庭會議',1],['規律運動',2],['保單年度健檢',0],['每天留時間給自己',1],['定期健康檢查',2]]}
};
let st={done:{},tags:true,pass:0};
try{const s=JSON.parse(localStorage.getItem('hanji_v1')||'{}');if(s.done)st.done=s.done;if(s.pass)st.pass=s.pass}catch(e){}
const save=()=>{try{localStorage.setItem('hanji_v1',JSON.stringify({done:st.done,pass:st.pass}))}catch(e){}};
const hasPass=()=>st.pass&&Date.now()-st.pass<30*864e5;
const unlocked=i=>i===0||!!st.done[ST[i-1].id];
const islandCode=i=>ST[i].island+'-'+String(i+1).padStart(2,'0');
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=ST.reduce((a,s)=>a+s.eps.length,0);
const doneCount=()=>ST.filter(s=>st.done[s.id]).length;
const rank=()=>RANKS[Math.min(RANKS.length-1,Math.ceil(doneCount()*5/8))];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
function copyLink(h){const u=location.href.split('#')[0]+(h?'#'+h:'');const done=()=>toast('連結已複製，可貼到 LINE 分享');
 try{navigator.clipboard.writeText(u).then(done,()=>fallback(u,done))}catch(e){fallback(u,done)}}
function fallback(u,done){const a=document.createElement('textarea');a.value=u;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast(u)}a.remove()}

function island(s,i,big){const [x,y]=POS[i];const d=st.done[s.id],lk=!unlocked(i),im=IMGS[s.id];
 return `<g class="isle" data-id="${s.id}" tabindex="0" role="button" aria-label="${esc(s.island)}">
 <ellipse cx="${x}" cy="${y+26}" rx="78" ry="22" fill="#9fcad5"/>
 <ellipse cx="${x}" cy="${y+14}" rx="70" ry="26" fill="#e9d7a8"/>
 <ellipse cx="${x}" cy="${y}" rx="60" ry="30" fill="${s.color}"/>
 <ellipse cx="${x-14}" cy="${y-8}" rx="30" ry="12" fill="#ffffff" opacity=".18"/>
 ${im?`<clipPath id="cp${i}"><circle cx="${x}" cy="${y-38}" r="46"/></clipPath><circle cx="${x}" cy="${y-38}" r="50" fill="#fff"/><image href="${im}" x="${x-70}" y="${y-85}" width="140" height="94" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${i})" ${lk?'opacity=".45"':''}/>`:`<circle cx="${x}" cy="${y-38}" r="50" fill="#fff"/><circle cx="${x}" cy="${y-38}" r="46" fill="${s.color}" opacity=".18"/><text x="${x}" y="${y-44}" text-anchor="middle" font-size="12" fill="${s.color}" font-weight="700">情境圖</text><text x="${x}" y="${y-26}" text-anchor="middle" font-size="12" fill="${s.color}">準備中</text>`}
 ${lk?`<g transform="translate(${x+30},${y-74})"><circle r="15" fill="#1f3a44"/><rect x="-7" y="-2" width="14" height="10" rx="2" fill="#fff"/><path d="M-4 -2 v-4 a4 4 0 0 1 8 0 v4" stroke="#fff" stroke-width="2" fill="none"/></g>`:''}
 ${d?`<circle cx="${x-38}" cy="${y-74}" r="13" fill="#fff" stroke="#c0603f" stroke-width="2"/><text x="${x-38}" y="${y-70}" text-anchor="middle" font-size="11" fill="#c0603f" font-weight="800">破案</text>`:''}
 <rect class="tagbg" x="${x-58}" y="${y+44}" width="116" height="24" rx="12" fill="#fff" opacity=".92"/>
 <text class="nametag" x="${x}" y="${y+61}" text-anchor="middle" fill="${s.color}">${i+1}. ${esc(s.island)}</text></g>`}
function mapSvg(){let route='';for(let i=0;i<POS.length-1;i++){const[a,b]=POS[i],[c,d]=POS[i+1];route+=`M${a} ${b+10} Q${(a+c)/2} ${(b+d)/2+60} ${c} ${d+10} `}
 let waves='';for(let k=0;k<14;k++){const x=40+((k*137)%960),y=60+((k*89)%400);waves+=`<path d="M${x} ${y} q8 -6 16 0 q8 6 16 0" stroke="#ffffff" stroke-width="2" fill="none" opacity=".6"/>`}
 return `<svg id="map" viewBox="0 0 1040 500" role="img" aria-label="財富航海群島地圖">${waves}
 <path d="${route}" stroke="#2f5d6a" stroke-width="2" stroke-dasharray="6 8" fill="none" opacity=".5"/>
 ${ST.map((s,i)=>island(s,i)).join('')}
 <g transform="translate(965,60)"><circle r="26" fill="#fff" opacity=".85"/><text y="-8" text-anchor="middle" font-size="12" fill="#2f5d6a">N</text><polygon points="0,-18 5,0 0,18 -5,0" fill="#c0603f"/></g></svg>`}
function renderMap(){$('#mapbox').innerHTML=mapSvg();$('#mapbox').classList.toggle('hideTags',!$('#tgTag').checked);
 document.querySelectorAll('#mapbox .isle').forEach(g=>{g.onclick=()=>openSt(g.dataset.id);g.onkeydown=e=>{if(e.key==='Enter')openSt(g.dataset.id)}});
 $('#heroMini').innerHTML=`<div style="padding:16px"><div style="font-weight:800;margin-bottom:6px">我的船員等級：${rank()}</div><div class="prog"><i style="width:${doneCount()/8*100}%"></i></div><div style="font-size:13px;color:#5f7680;margin-top:6px">已破案 ${doneCount()} / 8 座島　·　完成每座島的小遊戲即可領下一島通行碼</div><div style="font-size:13px;margin-top:6px">${hasPass()?'✅ 已登船（通行碼有效 30 天）':'⚓ 尚未登船：點任一座島領通行碼'}</div></div>`;
 $('#listView').innerHTML=ST.map((s,i)=>`<div class="lcard" style="--c:${s.color}" data-id="${s.id}">${IMGS[s.id]?`<img class="lthumb" src="${IMGS[s.id]}" alt="" loading="lazy">`:''}<b>${i+1}. ${esc(s.island)} ${st.done[s.id]?'<span class="stamp" style="font-size:11px">破案</span>':''}</b><small>${esc(s.theme)}・${s.eps.length} 案</small></div>`).join('');
 document.querySelectorAll('.lcard').forEach(c=>c.onclick=()=>openSt(c.dataset.id));
 $('#stats').innerHTML=`<div class="stat"><b>8</b><span>座島</span></div><div class="stat"><b>${total}</b><span>個財商案件</span></div><div class="stat"><b>${doneCount()}</b><span>已破案島嶼</span></div>`;
 const nx=ST.find(s=>!st.done[s.id]);$('#nextTip').textContent=nx?`下一站：${nx.island}`:'全部破案，恭喜成為傳承者！';}

function openSt(id,noScroll){const i=ST.findIndex(s=>s.id===id);if(i<0)return;const s=ST[i];
 document.querySelectorAll('.isle').forEach(g=>g.classList.toggle('focus',g.dataset.id===id));
 try{history.replaceState(null,'','#'+id.toLowerCase())}catch(e){}
 if(!hasPass()){gate(s,noScroll);return}
 if(!unlocked(i)){lockedIsle(s,i,noScroll);return}
 $('#detail').innerHTML=`<div class="panel" style="border-top:6px solid ${s.color}">
 ${IMGS[s.id]?`<div class="simg"><img src="${IMGS[s.id]}" alt="${esc(s.island)}情境圖" loading="lazy"></div>`:''}
 <div class="phead"><div><h2>${i+1}. ${esc(s.island)}｜${esc(s.theme)}</h2>
 <span class="chip">船員等級：${esc(s.rank)}</span><span class="chip">對應服務：${esc(s.service)}</span><span class="chip">${s.eps.length} 案</span></div>
 <div><button class="btn" id="shareSt">分享這一島</button></div></div>
 <div class="cases">${s.eps.map(e=>`<div class="case"><h4>${esc(e.name)}</h4><span class="chip">${esc(e.topic)}</span>
 <div class="hk">${esc(e.hook)}</div><p><b>財商重點：</b>${esc(e.point)}</p>
 <details><summary>看劇情</summary>${e.shots.map(x=>`<p><b>${esc(x[0])}：</b>${esc(x[1])}</p>`).join('')}</details>
 <p style="color:#5f7680">${e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">看 FB 原文影片</a>`:'影片連結：準備中'}</p></div>`).join('')}</div>
 <div class="game" id="game"></div>
 <div style="display:flex;justify-content:space-between;margin-top:12px"><button class="btn" id="prevSt" ${i===0?'disabled':''}>← 上一島</button><button class="btn pri" id="nextSt" ${i===ST.length-1?'disabled':''}>下一島 →</button></div></div>`;
 $('#shareSt').onclick=()=>copyLink(id.toLowerCase());
 $('#prevSt').onclick=()=>openSt(ST[i-1].id);$('#nextSt').onclick=()=>openSt(ST[i+1].id);
 game(s);if(!noScroll)$('#detail').scrollIntoView({behavior:'smooth'})}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function head(s,g){return `<h3>驗收小遊戲｜${esc(g.title)}</h3><div style="font-size:13px;color:#5f7680">全部答對即可在 ${esc(s.island)} 蓋上「破案」章　${st.done[s.id]?'<span class="stamp">已破案</span>':''}</div>`}
function foot(){return `<div class="fb" id="fb"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" id="reset">重新整理選單</button></div>`}
function win(s){st.done[s.id]=true;save();renderMap();document.querySelectorAll('.isle').forEach(g=>g.classList.toggle('focus',g.dataset.id===s.id));
 const i=ST.indexOf(s),nx=ST[i+1];
 $('#fb').innerHTML=`<span class="stamp">破案！</span>　恭喜完成 ${esc(s.island)}，目前等級：<b>${rank()}</b>。`+(nx?`<div class="ticket"><div class="tk-l">登島通行碼</div><div class="tk-c">${esc(islandCode(i+1))}</div><div style="font-size:13px">多多：「通行碼已自動收進你的航海日誌，下一站 ${esc(nx.island)} 解鎖了！」</div><button class="btn pri" id="goNext">登上 ${esc(nx.island)} →</button></div>`:`<div class="ticket"><div class="tk-l">全島破案</div><div class="tk-c">家庭財務長・傳承者</div><div style="font-size:13px">Angie：「恭喜你走完整趟航程！留言「破案」，我陪你規劃下一段人生航線。」</div></div>`);
 if(nx)$('#goNext').onclick=()=>openSt(nx.id)}
function duoSay(t){return `<div class="duo"><svg viewBox="0 0 80 80" width="64" height="64" aria-hidden="true"><ellipse cx="40" cy="48" rx="22" ry="26" fill="#f4a321"/><circle cx="40" cy="28" r="18" fill="#f7c234"/><path d="M28 50 q-14 6 -10 20 q10 -4 14 -16z" fill="#4c9a3a"/><path d="M52 50 q14 6 10 20 q-10 -4 -14 -16z" fill="#4c9a3a"/><circle cx="34" cy="26" r="4" fill="#222"/><circle cx="46" cy="26" r="4" fill="#222"/><path d="M36 33 q4 6 8 0 q-4 -2 -8 0z" fill="#333"/></svg><div class="bubble">${t}</div></div>`}
function gate(s,noScroll){$('#detail').innerHTML=`<div class="panel gate" style="border-top:6px solid ${s.color}">
 ${IMGS[s.id]?`<div class="simg" style="filter:saturate(.6)"><img src="${IMGS[s.id]}" alt="${esc(s.island)}情境圖"></div>`:''}
 <h2 style="margin:0 0 8px">⚓ 登島前，先領「登船通行碼」</h2>
 ${duoSay(`多多來了！船員請注意～ <b>${esc(s.island)}</b> 就在前面，但偵探社的島嶼只讓「有通行碼」的船員登島喔！三步驟就能拿到：`)}
 <ol class="gsteps"><li><b>加入</b> Angie 的 LINE 官方帳號：<a href="${LINE_URL}" target="_blank" rel="noopener">${LINE_URL}</a></li>
 <li>在聊天室輸入關鍵字 <span class="kw">${esc(LINE_KEY)}</span>，就會收到你的通行碼</li>
 <li>回到這裡輸入通行碼，按「登島」</li></ol>
 <form id="pf" class="pform"><input id="pc" autocomplete="off" placeholder="輸入登船通行碼" aria-label="登船通行碼"><button class="btn pri">登島</button></form><div class="fb" id="pfb"></div>
 <div style="font-size:13px;color:#5f7680;margin-top:6px">登島一次，這台裝置會記住 30 天。還沒登島前，也可以先逛：</div>
 <div class="gmenu"><button class="btn" data-v="tour">多多導覽</button><button class="btn" data-v="index">案件索引</button><button class="btn" data-v="voyage">我的航程</button></div></div>`;
 $('#pf').onsubmit=e=>{e.preventDefault();const v=$('#pc').value.trim();
  if(!v){$('#pfb').textContent='請先輸入通行碼。';return}
  if(v===PASS_CODE){st.pass=Date.now();save();renderMap();toast('登島成功！');openSt(s.id)}else{$('#pfb').textContent='通行碼不對喔，請到 LINE 輸入「'+LINE_KEY+'」再確認一次。'}};
 $('#pc').oninput=()=>$('#pfb').textContent='';
 document.querySelectorAll('.gmenu .btn').forEach(b=>b.onclick=()=>{view(b.dataset.v);$('#tabs').scrollIntoView({behavior:'smooth'})});
 if(!noScroll)$('#detail').scrollIntoView({behavior:'smooth'})}
function lockedIsle(s,i,noScroll){const pv=ST[i-1];$('#detail').innerHTML=`<div class="panel gate" style="border-top:6px solid ${s.color}">
 ${IMGS[s.id]?`<div class="simg" style="filter:grayscale(.7)"><img src="${IMGS[s.id]}" alt="${esc(s.island)}情境圖"></div>`:''}
 <h2 style="margin:0 0 8px">🔒 ${esc(s.island)} 還沒解鎖</h2>
 ${duoSay(`等等！船長，這座島的「登島通行碼」藏在上一站 <b>${esc(pv.island)}</b>。先去那裡破案、完成驗收小遊戲，通行碼就會自動收進你的航海日誌！`)}
 <button class="btn pri" id="goPrev">前往 ${esc(pv.island)} 領通行碼</button></div>`;
 $('#goPrev').onclick=()=>openSt(pv.id);if(!noScroll)$('#detail').scrollIntoView({behavior:'smooth'})}
function game(s){const g=GAMES[s.id],box=$('#game');
 if(g.type==='quiz'){let right=0,ans=0;const qs=shuffle(g.qs);
  box.innerHTML=head(s,g)+qs.map((q,k)=>`<div style="margin-top:10px"><b>Q${k+1}. ${esc(q.q)}</b>${q.a.map((a,j)=>`<button class="opt" data-k="${k}" data-j="${j}">${esc(a)}</button>`).join('')}<div class="fb" id="w${k}"></div></div>`).join('')+foot();
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,j=+b.dataset.j,q=qs[k];
   if(box.querySelector(`.opt[data-k="${k}"].ok`))return;
   if(j===q.c){b.classList.add('ok');$('#w'+k).textContent='答對！'+q.why;ans++;if(ans===qs.length)win(s)}
   else{b.classList.add('no');$('#w'+k).textContent='再想想：'+q.why}})}
 if(g.type==='sort'){const items=shuffle(g.items);let sel=null,ok=0;
  box.innerHTML=head(s,g)+`<p style="font-size:14px">先點一個項目，再點它該去的地方。</p><div id="pool">${items.map((it,k)=>`<span class="item" data-k="${k}">${esc(it[0])}</span>`).join('')}</div><div class="bins">${g.bins.map((b,j)=>`<div class="bin" data-j="${j}"><b>${esc(b)}</b></div>`).join('')}</div>`+foot();
  box.querySelectorAll('.item').forEach(e=>e.onclick=()=>{if(e.classList.contains('ok'))return;box.querySelectorAll('.item').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');sel=e});
  box.querySelectorAll('.bin').forEach(bn=>bn.onclick=()=>{if(!sel)return;const it=items[+sel.dataset.k];
   if(it[1]===+bn.dataset.j){sel.classList.remove('sel','no');sel.classList.add('ok');bn.appendChild(sel);ok++;$('#fb').textContent='放對了！';sel=null;if(ok===items.length)win(s)}
   else{sel.classList.add('no');$('#fb').textContent='這個不屬於「'+g.bins[+bn.dataset.j]+'」，再試一次。'}})}
 if(g.type==='order'){const sh=shuffle(g.steps);let n=0;
  box.innerHTML=head(s,g)+`<p style="font-size:14px">依 Day1 → Day5 的順序點選。</p><div>${sh.map(t=>`<span class="item" data-t="${esc(t)}">${esc(t)}</span>`).join('')}</div><ol id="ord" style="font-size:14px"></ol>`+foot();
  box.querySelectorAll('.item').forEach(e=>e.onclick=()=>{if(e.classList.contains('ok'))return;
   if(e.dataset.t===g.steps[n]){e.classList.add('ok');$('#ord').insertAdjacentHTML('beforeend',`<li>Day${n+1} ${esc(g.steps[n])}</li>`);n++;$('#fb').textContent='正確！';if(n===g.steps.length)win(s)}
   else{e.classList.add('no');setTimeout(()=>e.classList.remove('no'),600);$('#fb').textContent='順序不對喔，Day'+(n+1)+' 應該先做什麼？'}})}
 $('#reset').onclick=()=>game(s);
 ['copy','cut','paste','contextmenu','selectstart','dragstart'].forEach(ev=>box.addEventListener(ev,e=>e.preventDefault()))}

function renderTour(){let k=0,timer=null;const steps=[{t:'嗨！我是多多，人生金錢偵探社的社區管家。多多來了，真相不遠了！跟我一起逛 8 座島吧。'}].concat(ST.map((s,i)=>({id:s.id,t:`第 ${i+1} 站「${s.island}」：${s.theme}。這裡有 ${s.eps.length} 個案件，等級是 ${s.rank}。破完案記得玩驗收小遊戲蓋章！`}))).concat([{t:'逛完了！從迷霧港開始，一島一島破案，你就是家庭財務長。看完影片留言「破案」，Angie 陪你啟航。'}]);
 const draw=()=>{const s=steps[k];$('#vTour').innerHTML=`<div class="guide"><div class="who"><svg viewBox="0 0 80 80" width="80" height="80" aria-hidden="true"><ellipse cx="40" cy="48" rx="22" ry="26" fill="#f4a321"/><circle cx="40" cy="28" r="18" fill="#f7c234"/><path d="M28 50 q-14 6 -10 20 q10 -4 14 -16z" fill="#4c9a3a"/><path d="M52 50 q14 6 10 20 q-10 -4 -14 -16z" fill="#4c9a3a"/><circle cx="34" cy="26" r="4" fill="#222"/><circle cx="46" cy="26" r="4" fill="#222"/><path d="M36 33 q4 6 8 0 q-4 -2 -8 0z" fill="#333"/></svg>多多｜社區管家</div>
 <div><div style="font-size:16px">${esc(s.t)}</div><div class="ctrl"><button class="btn" id="tp">←</button><span>${k+1} / ${steps.length}</span><button class="btn" id="tn">→</button><button class="btn" id="ta">${timer?'暫停':'自動播放'}</button>${s.id?`<button class="btn pri" id="tgo">去這座島</button>`:''}</div></div></div>`;
  $('#tp').onclick=()=>{k=(k-1+steps.length)%steps.length;draw()};$('#tn').onclick=()=>{k=(k+1)%steps.length;draw()};
  $('#ta').onclick=()=>{if(timer){clearInterval(timer);timer=null}else{timer=setInterval(()=>{k=(k+1)%steps.length;draw()},4500)}draw()};
  if(s.id)$('#tgo').onclick=()=>{if(timer){clearInterval(timer);timer=null}view('map');openSt(s.id)}};draw()}
function renderIndex(){const rows=ST.flatMap((s,i)=>s.eps.map(e=>({s,i,e})));
 $('#vIndex').innerHTML=`<input id="q" placeholder="搜尋案件，例如：預備金、分期、傳承"><table id="it"></table>`;
 const f=()=>{const q=$('#q').value.trim();$('#it').innerHTML=rows.filter(r=>!q||(r.e.name+r.e.topic+r.e.hook+r.e.point+r.s.island).includes(q)).map(r=>`<tr data-id="${r.s.id}" style="cursor:pointer"><td style="color:${r.s.color};white-space:nowrap">${r.i+1}. ${esc(r.s.island)}</td><td><b>${esc(r.e.name)}</b><br><small style="color:#5f7680">${esc(r.e.hook)}</small></td></tr>`).join('')||'<tr><td>找不到相關案件，換個關鍵字試試。</td></tr>';
  document.querySelectorAll('#it tr[data-id]').forEach(t=>t.onclick=()=>{view('map');openSt(t.dataset.id)})};$('#q').oninput=f;f()}
function renderVoyage(){$('#vVoyage').innerHTML=`<h3 style="margin-top:0">我的航程｜目前等級：${rank()}</h3><div class="prog"><i style="width:${doneCount()/8*100}%"></i></div>
 <div class="cases">${ST.map((s,i)=>`<div class="case" style="border-left:6px solid ${s.color}"><h4>${i+1}. ${esc(s.island)}</h4><p>${esc(s.theme)}</p><p>${st.done[s.id]?'<span class="stamp">已破案</span>':'<button class="btn" data-id="'+s.id+'">前往破案</button>'}</p></div>`).join('')}</div>
 <p style="font-size:13px;color:#5f7680">進度只存在這台裝置的瀏覽器；換手機或清除瀏覽紀錄會重新開始。</p><button class="btn" id="clr">清除我的進度</button>`;
 document.querySelectorAll('#vVoyage button[data-id]').forEach(b=>b.onclick=()=>{view('map');openSt(b.dataset.id)});
 $('#clr').onclick=()=>{st.done={};save();renderMap();renderVoyage();toast('進度已清除')}}
function view(v){document.querySelectorAll('.gtab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 $('#vMap').style.display=v==='map'?'':'none';$('#vTour').style.display=v==='tour'?'':'none';$('#vIndex').style.display=v==='index'?'':'none';$('#vVoyage').style.display=v==='voyage'?'':'none';
 if(v==='tour')renderTour();if(v==='index')renderIndex();if(v==='voyage')renderVoyage()}
document.querySelectorAll('.gtab').forEach(b=>b.onclick=()=>view(b.dataset.v));
document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const g=t.dataset.go;if(g==='index'){view('index');$('#tabs').scrollIntoView({behavior:'smooth'})}else{view('map');const nx=g==='next'?(ST.find(s=>!st.done[s.id])||ST[0]).id:g;openSt(nx)}});
$('#tgTag').onchange=()=>$('#mapbox').classList.toggle('hideTags',!$('#tgTag').checked);
$('#tgList').onchange=()=>{const l=$('#tgList').checked;$('#mapbox').style.display=l?'none':'';$('#listView').style.display=l?'':'none'};
let idle=0,ai=0;['pointerdown','keydown','wheel','touchstart'].forEach(e=>addEventListener(e,()=>idle=0,{passive:true}));
setInterval(()=>{idle+=1;if($('#tgAuto').checked&&idle>=3&&$('#vMap').style.display!=='none'){ai=(ai+1)%ST.length;document.querySelectorAll('#mapbox .isle').forEach(g=>g.classList.toggle('focus',g.dataset.id===ST[ai].id))}},2000);
$('#shareTop').onclick=()=>copyLink('');
renderMap();
function fromHash(){const h=(location.hash||'').slice(1).toUpperCase();if(ST.some(s=>s.id===h))openSt(h,true)}
addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
