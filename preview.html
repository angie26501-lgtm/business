<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財顧芸 Angie｜行程後台預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans TC',sans-serif;background:#fff;color:#1a1a1a}.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;border-bottom:1px solid #ddd;padding-bottom:16px;margin-bottom:16px;flex-wrap:wrap}.title{font-family:'DM Serif Display',serif;font-size:28px}.sub{font-size:13px;color:#666;margin-top:4px}.badge{font-size:12px;background:#f5f4f0;border:1px solid #ddd;border-radius:99px;padding:5px 12px}.status{font-size:13px;line-height:1.6;border-radius:10px;padding:10px 14px;margin:12px 0}.ok{background:#e8f8f2;color:#0f5e3a;border:1px solid #a0ddc0}.warn{background:#fff8e6;color:#7a5000;border:1px solid #f0d080}.err{background:#fce8e8;color:#a32d2d;border:1px solid #f0a0a0}.tabs,.modes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button,.modes button,.nav button{font-family:'Noto Sans TC';font-size:13px;border:1px solid #bbb;background:white;border-radius:999px;padding:7px 14px;cursor:pointer}.tabs button.active,.modes button.active{background:#1a1a1a;color:white;border-color:#1a1a1a}.tabs button.angie{background:#1D9E75;color:white;border-color:#1D9E75}.tabs button.kenny{background:#378ADD;color:white;border-color:#378ADD}.tabs button.bday{background:#D4537E;color:white;border-color:#D4537E}.tabs button.family{background:#EF9F27;color:white;border-color:#EF9F27}.tabs button.holiday{background:#D0202A;color:white;border-color:#D0202A}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.nav{display:flex;align-items:center;justify-content:space-between;background:#f5f4f0;border-radius:10px;padding:9px 12px;margin:14px 0}.nav .label{font-weight:700}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#ddd;border:1px solid #ddd}.head{background:#f5f4f0;text-align:center;color:#888;font-size:12px;padding:7px}.cell{background:white;min-height:96px;padding:6px}.cell.other{background:#fafafa;color:#aaa}.num{font-weight:700;font-size:13px;margin-bottom:5px}.today .num span{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#111;color:white}.event{display:flex;gap:4px;align-items:flex-start;font-size:11px;margin:3px 0;line-height:1.35;word-break:break-word}.dot{width:7px;height:7px;border-radius:50%;margin-top:4px;flex:0 0 auto}.weeklist,.daylist{border-top:1px solid #ddd}.row{display:grid;grid-template-columns:76px 1fr;gap:10px;border-bottom:1px solid #eee;padding:10px 4px}.datebox{text-align:center;color:#777}.datebox b{display:block;font-size:22px;color:#111}.item{font-size:14px;margin:4px 0;padding:6px 8px;border-radius:8px}.i-angie{background:#e8f8f2;color:#0f5e3a}.i-kenny{background:#ddeeff;color:#1a5fa5}.i-bday{background:#fce8f2;color:#993556}.i-family{background:#fff0d0;color:#8a6000}.i-holiday{background:#fce8e8;color:#a32d2d}.empty{color:#aaa;font-size:13px;padding:20px;text-align:center}.footer{font-size:11px;color:#aaa;text-align:center;border-top:1px solid #eee;margin-top:24px;padding-top:16px}@media(max-width:560px){.grid{font-size:12px}.cell{min-height:78px;padding:4px}.event{font-size:10px}.row{grid-template-columns:58px 1fr}.title{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><div><div class="title">財顧芸 Angie｜2026 行程</div><div class="sub">Google Sheets 後台同步版｜陳芸琪 & Kenny</div></div><div class="badge" id="todayBadge">今天：2026年5月26日</div></div>
  <div class="top"><div class="tabs" id="tabs"><button class="active" data-who="all">📋 總表</button><button data-who="angie">👩 Angie</button><button data-who="kenny">👨 Kenny</button><button data-who="bday">🎂 生日</button><button data-who="family">👨‍👩‍👧‍👦 家族</button><button data-who="holiday">🇹🇼 假日</button></div><div class="modes" id="modes"><button class="active" data-mode="month">月</button><button data-mode="list">清單</button><button data-mode="day">日</button></div></div>
  <div id="status" class="status warn">正在讀取 Google Sheets 行程資料…</div>
  <div class="nav"><button onclick="prev()">‹</button><div><span class="label" id="navLabel"></span> <button onclick="goToday()">今天</button></div><button onclick="next()">›</button></div>
  <div id="calendar"></div>
  <div class="footer">財顧芸 Angie 陳芸琪 & Kenny｜行程後台同步測試頁</div>
</div>
<script>
var SHEET_ID='1KGO0LuV5gm7EnfdabxfBda9kTHfTRMlnUlmV8bHUs24';
var SHEET_NAME='EVENTS';
var EVENTS=[];
var curYear=2026,curMonth=4,curDay=26,curWho='all',curMode='month';
var loaded=false;
var HOLIDAYS={'2026-06-19':'端午節','2026-09-25':'中秋節','2026-09-26':'中秋節補假','2026-09-28':'孔子誕辰紀念日'};
var W=['日','一','二','三','四','五','六'];
function $(id){return document.getElementById(id)}
function setStatus(msg,type){var el=$('status');el.className='status '+(type||'warn');el.textContent=msg}
function ds(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function color(w){return w==='angie'?'#1D9E75':w==='kenny'?'#378ADD':w==='bday'?'#D4537E':w==='family'?'#EF9F27':'#D0202A'}
function cls(w){return 'i-'+(w||'holiday')}
function ncell(c){if(!c)return'';if(c.f!==undefined&&c.f!==null&&String(c.f).trim()!=='')return String(c.f).trim();if(Array.isArray(c.v)&&c.v.length>=2)return String(c.v[0]).padStart(2,'0')+':'+String(c.v[1]).padStart(2,'0');if(c.v!==undefined&&c.v!==null)return String(c.v).trim();return''}
function ndate(c){if(!c)return'';var f=c.f,v=c.v;if(f){var s=String(f).replace(/\//g,'-').trim();var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m)return m[1]+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0')}if(typeof v==='string'){var d=v.match(/Date\((\d+),(\d+),(\d+)\)/);if(d)return d[1]+'-'+String(+d[2]+1).padStart(2,'0')+'-'+String(+d[3]).padStart(2,'0');var s2=v.replace(/\//g,'-').trim();var m2=s2.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);if(m2)return m2[1]+'-'+String(+m2[2]).padStart(2,'0')+'-'+String(+m2[3]).padStart(2,'0');return s2}return String(v||'').trim()}
window.handleSheetResponse=function(resp){loaded=true;try{if(!resp||resp.status==='error')throw new Error('Google 回傳錯誤');var rows=(resp.table&&resp.table.rows)?resp.table.rows:[];EVENTS=[];rows.forEach(function(r){var c=r.c||[];var e={date:ndate(c[0]),who:ncell(c[1]).toLowerCase(),time:ncell(c[2])||'全天',name:ncell(c[3])};if(e.date&&e.who&&e.name&&['angie','kenny','family','bday','holiday'].indexOf(e.who)>=0)EVENTS.push(e)});render();setStatus('已成功讀取 Google Sheets：'+EVENTS.length+' 筆行程。','ok')}catch(err){console.error(err);EVENTS=[];render();setStatus('Google Sheets 讀取或解析失敗：請確認分頁 EVENTS 與欄位 date / who / time / name。','err')}};
function load(){var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?sheet='+encodeURIComponent(SHEET_NAME)+'&tqx=out:json;responseHandler:handleSheetResponse&tq='+encodeURIComponent('select A,B,C,D')+'&_='+Date.now();var s=document.createElement('script');s.src=url;s.onerror=function(){setStatus('無法連線 Google Sheets。請確認共用權限為「知道連結的人可檢視」。','err')};document.body.appendChild(s);setTimeout(function(){if(!loaded)setStatus('尚未讀到 Google Sheets。請確認「共用」權限，或到 檔案 → 共用 → 發布到網路，發布 EVENTS。','warn')},8000)}
function filtered(date){return EVENTS.filter(function(e){return(!date||e.date===date)&&(curWho==='all'||e.who===curWho)})}
function updateNav(){if(curMode==='day')$('navLabel').textContent=curYear+'年'+(curMonth+1)+'月'+curDay+'日';else $('navLabel').textContent=curYear+'年'+(curMonth+1)+'月'}
function render(){updateNav();if(curMode==='month')return renderMonth();if(curMode==='day')return renderDay();return renderList()}
function renderMonth(){var y=curYear,m=curMonth,first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate(),off=(first+6)%7,cells=[];for(var i=off-1;i>=0;i--)cells.push({d:prevDays-i,cur:false});for(var d=1;d<=days;d++)cells.push({d:d,cur:true});while(cells.length%7)cells.push({d:cells.length-days-off+1,cur:false});var html='<div class="grid">';['一','二','三','四','五','六','日'].forEach(function(x){html+='<div class="head">'+x+'</div>'});cells.forEach(function(c,idx){var cm=c.cur?m:(idx<7?m-1:m+1),cy=y;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}var date=ds(cy,cm,c.d),evs=filtered(date),today=(cy===2026&&cm===4&&c.d===26);html+='<div class="cell '+(c.cur?'':'other')+' '+(today?'today':'')+'"><div class="num">'+(today?'<span>'+c.d+'</span>':c.d)+'</div>';if(HOLIDAYS[date]&&c.cur)html+='<div class="event"><span class="dot" style="background:#D0202A"></span>'+HOLIDAYS[date]+'</div>';evs.slice(0,3).forEach(function(e){var t=(e.time==='全天'||e.time==='節日')?'':e.time+' ';html+='<div class="event"><span class="dot" style="background:'+color(e.who)+'"></span><span>'+t+e.name+'</span></div>'});if(evs.length>3)html+='<div class="event">+還有 '+(evs.length-3)+' 項</div>';html+='</div>'});html+='</div>';$('calendar').innerHTML=html}
function renderList(){var ym=curYear+'-'+String(curMonth+1).padStart(2,'0')+'-',evs=EVENTS.filter(function(e){return e.date.indexOf(ym)===0&&(curWho==='all'||e.who===curWho)}).sort(function(a,b){return(a.date+a.time).localeCompare(b.date+b.time)});if(!evs.length){$('calendar').innerHTML='<div class="empty">這個月份目前沒有行程</div>';return}var by={};evs.forEach(function(e){(by[e.date]=by[e.date]||[]).push(e)});var html='<div class="weeklist">';Object.keys(by).forEach(function(date){var dd=new Date(date+'T00:00:00');html+='<div class="row"><div class="datebox"><b>'+dd.getDate()+'</b>'+W[dd.getDay()]+'</div><div>';by[date].forEach(function(e){html+='<div class="item '+cls(e.who)+'">'+e.time+'　'+e.name+'</div>'});html+='</div></div>'});html+='</div>';$('calendar').innerHTML=html}
function renderDay(){var date=ds(curYear,curMonth,curDay),evs=filtered(date);if(!evs.length){$('calendar').innerHTML='<div class="empty">這一天目前沒有行程</div>';return}var html='<div class="daylist"><div class="row"><div class="datebox"><b>'+curDay+'</b>'+W[new Date(curYear,curMonth,curDay).getDay()]+'</div><div>';evs.sort(function(a,b){return a.time.localeCompare(b.time)}).forEach(function(e){html+='<div class="item '+cls(e.who)+'">'+e.time+'　'+e.name+'</div>'});html+='</div></div></div>';$('calendar').innerHTML=html}
function prev(){if(curMode==='day'){var d=new Date(curYear,curMonth,curDay-1);curYear=d.getFullYear();curMonth=d.getMonth();curDay=d.getDate()}else{curMonth--;if(curMonth<0){curMonth=11;curYear--}}render()}
function next(){if(curMode==='day'){var d=new Date(curYear,curMonth,curDay+1);curYear=d.getFullYear();curMonth=d.getMonth();curDay=d.getDate()}else{curMonth++;if(curMonth>11){curMonth=0;curYear++}}render()}
function goToday(){curYear=2026;curMonth=4;curDay=26;render()}
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){curWho=b.dataset.who;document.querySelectorAll('#tabs button').forEach(function(x){x.className=''});b.className=curWho==='all'?'active':curWho;render()}});
document.querySelectorAll('#modes button').forEach(function(b){b.onclick=function(){curMode=b.dataset.mode;document.querySelectorAll('#modes button').forEach(function(x){x.className=''});b.className='active';render()}});
render();load();
</script>
</body>
</html>
