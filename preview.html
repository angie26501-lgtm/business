<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財顧芸 Angie｜2026 行程總覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff;--bg2:#f5f4f0;--bg3:#eeedea;
  --text:#1a1a1a;--text2:#6b6b6b;--text3:#aaa;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --green:#1D9E75;--blue:#378ADD;--red:#E24B4A;--amber:#EF9F27;--pink:#D4537E;
  --radius:10px;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.page-wrap{max-width:760px;margin:0 auto;padding:1.5rem 1rem 5rem;}

/* HERO */
.hero{padding-bottom:1.25rem;border-bottom:0.5px solid var(--border2);margin-bottom:1.25rem;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.hero-title{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;letter-spacing:-0.5px;}
.hero-sub{font-size:13px;color:var(--text2);margin-top:4px;}
.hero-badge{font-size:11px;padding:4px 12px;border-radius:20px;background:var(--bg2);color:var(--text2);border:0.5px solid var(--border2);}

/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:1rem;}

/* WHO TABS */
.who-tabs{display:flex;gap:5px;flex-wrap:wrap;}
.who-btn{font-family:'Noto Sans TC',sans-serif;font-size:12px;font-weight:500;padding:5px 13px;border-radius:20px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;}
.who-btn:hover{background:var(--bg2);color:var(--text);}
.who-btn.active{background:var(--text);color:#fff;border-color:transparent;}
.who-btn.angie-on{background:var(--green);color:#fff;border-color:transparent;}
.who-btn.kenny-on{background:var(--blue);color:#fff;border-color:transparent;}
.who-btn.bday-on{background:var(--pink);color:#fff;border-color:transparent;}
.who-btn.family-on{background:#E9A020;color:#fff;border-color:transparent;}
.who-btn.holiday-on{background:#D0202A;color:#fff;border-color:transparent;}

/* VIEW MODE */
.view-mode{display:flex;gap:4px;}
.mode-btn{font-family:'Noto Sans TC',sans-serif;font-size:12px;padding:5px 12px;border-radius:8px;border:0.5px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;}
.mode-btn:hover{background:var(--bg2);}
.mode-btn.active{background:var(--text);color:#fff;border-color:transparent;}

/* NAV BAR */
.nav-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;padding:8px 12px;background:var(--bg2);border-radius:var(--radius);}
.nav-label{font-size:15px;font-weight:500;color:var(--text);}
.nav-btn{background:none;border:0.5px solid var(--border2);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:14px;color:var(--text2);}
.nav-btn:hover{background:var(--bg3);}
.today-btn{font-size:12px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--border2);background:transparent;cursor:pointer;color:var(--text2);}
.today-btn:hover{background:var(--bg3);}

/* ====== MONTH VIEW ====== */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);}
.month-header{background:var(--bg2);text-align:center;font-size:11px;font-weight:500;color:var(--text3);padding:6px 0;letter-spacing:1px;}
.month-cell{background:var(--bg);min-height:88px;padding:5px;position:relative;cursor:pointer;transition:background .1s;}
.month-cell:hover{background:var(--bg2);}
.month-cell.other-month .cell-num{color:var(--text3);}
.month-cell.today-cell{background:#f0fdf8;}
.month-cell.today-cell .cell-num{background:var(--text);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.cell-num{font-size:13px;font-weight:500;margin-bottom:3px;color:var(--text);}
.cell-num.holiday-num{color:var(--red);}
.cell-event{display:flex;align-items:center;gap:3px;margin-bottom:2px;overflow:hidden;}
.cell-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.cell-title{font-size:10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.cell-more{font-size:10px;color:var(--text3);}

/* ====== WEEK VIEW ====== */
.week-grid{display:grid;grid-template-columns:50px repeat(7,1fr);gap:1px;background:var(--border);}
.week-col-header{background:var(--bg2);text-align:center;padding:8px 4px;}
.week-day-name{font-size:11px;color:var(--text3);}
.week-day-num{font-size:18px;font-weight:500;color:var(--text);}
.week-day-num.today-num{background:var(--text);color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin:0 auto;}
.week-day-num.holi-num{color:var(--red);}
.time-label{background:var(--bg);padding:3px 4px;text-align:right;font-size:10px;color:var(--text3);border-top:0.5px solid var(--border);}
.week-cell{background:var(--bg);min-height:36px;padding:3px;border-top:0.5px solid var(--border);}
.week-event{font-size:11px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.we-angie{background:#e8f8f2;color:#0f5e3a;}
.we-kenny{background:#ddeeff;color:#1a5fa5;}
.we-bday{background:#fce8f2;color:#993556;}
.we-family{background:#fff0d0;color:#8a6000;}
.we-holiday{background:#fce8e8;color:#a32d2d;}

/* ====== DAY VIEW ====== */
.day-view-wrap{display:grid;grid-template-columns:50px 1fr;gap:1px;background:var(--border);}
.day-time-col{background:var(--bg);}
.day-events-col{background:var(--bg);}
.day-time-slot{height:52px;padding:2px 6px;text-align:right;font-size:11px;color:var(--text3);border-top:0.5px solid var(--border);}
.day-event-slot{height:52px;padding:3px;border-top:0.5px solid var(--border);position:relative;}
.day-event-item{padding:3px 8px;border-radius:5px;font-size:12px;margin-bottom:2px;}
.de-angie{background:#e8f8f2;color:#0f5e3a;border-left:3px solid var(--green);}
.de-kenny{background:#ddeeff;color:#1a5fa5;border-left:3px solid var(--blue);}
.de-bday{background:#fce8f2;color:#993556;border-left:3px solid var(--pink);}
.de-family{background:#fff0d0;color:#8a6000;border-left:3px solid #E9A020;}
.de-holiday{background:#fce8e8;color:#a32d2d;border-left:3px solid var(--red);}

/* ====== SPECIAL VIEWS ====== */
.special-view{display:none;}
.special-header{background:#f8f4f0;border:0.5px solid var(--border2);border-radius:var(--radius);padding:10px 14px;margin-bottom:1.25rem;font-size:13px;color:var(--text2);}
.bday-section{margin-bottom:1.5rem;}
.bday-month-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:8px;padding-bottom:5px;border-bottom:0.5px solid var(--border);}
.bday-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;transition:background .12s;}
.bday-item:hover{background:var(--bg2);}
.bday-date-box{min-width:50px;text-align:center;}
.bday-date-num{font-size:20px;font-weight:500;color:var(--text);line-height:1;}
.bday-date-day{font-size:11px;color:var(--text3);margin-top:2px;}
.bday-avatar{width:34px;height:34px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.bday-name{font-size:14px;color:var(--text);font-weight:500;}
.bday-note{font-size:11px;color:var(--text2);margin-top:2px;}

/* LEGEND */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:1.25rem 0;padding:10px 14px;background:var(--bg2);border-radius:var(--radius);}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.footer{margin-top:2rem;padding-top:1rem;border-top:0.5px solid var(--border);font-size:11px;color:var(--text3);text-align:center;}
</style>
</head>

<script>
// ============================================================
// Google Sheets 後台設定
// ============================================================
// 後台試算表：財顧芸｜行程後台
// 工作表名稱：EVENTS
// 欄位順序：date | who | time | name
var SHEET_ID = '1KGO0LuV5gm7EnfdabxfBda9kTHfTRMlnUlmV8bHUs24';
var EVENTS_SHEET = 'EVENTS';

// 先放空陣列，頁面載入後會從 Google Sheets 自動更新
var EVENTS = [];

// 若 Google Sheets 暫時讀取失敗，會顯示這個提示，避免整頁空白
function showLoadError(msg) {
  var area = document.getElementById('calendar-area');
  if (!area) return;
  area.innerHTML =
    '<div style="padding:16px;border:0.5px solid var(--border2);border-radius:10px;background:var(--bg2);color:var(--text2);font-size:13px;line-height:1.7;">' +
    '⚠️ 行程資料暫時無法讀取。<br>' +
    '請確認 Google Sheets 權限已設為「知道連結的人可檢視」，並確認 EVENTS 分頁第一列欄位為 date、who、time、name。<br>' +
    '<span style="font-size:11px;color:var(--text3);">' + msg + '</span>' +
    '</div>';
}

function normalizeSheetValue(v) {
  if (v === null || v === undefined) return '';
  return String(v).trim();
}

function normalizeDateValue(v) {
  if (v === null || v === undefined) return '';
  var s = String(v).trim();

  // Google Visualization API sometimes returns dates like Date(2026,5,3)
  // Month in this format is zero-based, so 5 means June.
  var m = s.match(/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/);
  if (m) {
    var y = Number(m[1]);
    var mo = Number(m[2]) + 1;
    var d = Number(m[3]);
    return y + '-' + (mo < 10 ? '0' + mo : mo) + '-' + (d < 10 ? '0' + d : d);
  }

  // Accept 2026/06/03 and convert to 2026-06-03.
  s = s.replace(/\//g, '-');
  var parts = s.split('-');
  if (parts.length === 3) {
    var yy = parts[0];
    var mm = parts[1].padStart(2, '0');
    var dd = parts[2].padStart(2, '0');
    return yy + '-' + mm + '-' + dd;
  }
  return s;
}

function parseGvizResponse(text) {
  var jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
  return JSON.parse(jsonText);
}

async function loadEventsFromGoogleSheet() {
  var url =
    'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
    '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(EVENTS_SHEET);

  var res = await fetch(url);
  if (!res.ok) throw new Error('Google Sheets 回應失敗：' + res.status);

  var text = await res.text();
  var data = parseGvizResponse(text);
  var rows = data.table.rows || [];

  var loaded = rows.map(function(row) {
    var c = row.c || [];
    return {
      date: normalizeDateValue(c[0] && c[0].v),
      who: normalizeSheetValue(c[1] && c[1].v).toLowerCase(),
      time: normalizeSheetValue(c[2] && c[2].v),
      name: normalizeSheetValue(c[3] && c[3].v)
    };
  }).filter(function(e) {
    return e.date && e.who && e.time && e.name;
  });

  EVENTS = loaded;
}

// 假日
var HOLIDAYS = {
  '2026-06-19':'端午節',
  '2026-09-25':'中秋節',
  '2026-09-26':'中秋節補假',
  '2026-09-28':'孔子誕辰紀念日',
};

// 生日資料
var BDAY_DATA = {
  '8月':[
    {date:'4',day:'二',name:'智逸'},
    {date:'6',day:'四',name:'康軒欣宏'},
    {date:'7',day:'五',name:'寶貝晏好 / 林雅娟 / 岳母農曆生日'},
    {date:'10',day:'一',name:'老哥農曆生日'},
    {date:'12',day:'三',name:'南屏方世齡 / 明玉'},
    {date:'14',day:'五',name:'新生陳銘俊'},
    {date:'20',day:'四',name:'吳秀蘭 / 何昶毅'},
    {date:'22',day:'六',name:'林詮榮 / 謝元杰 / 玉佳'},
    {date:'23',day:'日',name:'何純良 / 葉翠瑛'},
    {date:'27',day:'四',name:'康軒林哲偉'},
  ],
  '9月':[
    {date:'5', day:'六',name:'林佳臻 / 朱娃娃'},
    {date:'9', day:'三',name:'黃輝鍊'},
    {date:'14',day:'一',name:'裒人修志'},
    {date:'19',day:'六',name:'潘文芬'},
    {date:'21',day:'一',name:'梁弄菊'},
    {date:'25',day:'五',name:'光度朱嘉莉 / 陳忠駿'},
    {date:'26',day:'六',name:'許勝弘'},
    {date:'27',day:'日',name:'陳志勇'},
  ],
  '8月底（顯示於9月）':[
    {date:'31',day:'一',name:'賴乃嫚 / 莊蕙瑜'},
  ]
};

// ============================================================
// STATE
// ============================================================
var today = new Date(2026,4,26); // 2026-05-26
var curYear=2026, curMonth=4, curDay=26; // month 0-indexed
var curMode='month';
var curWho='all';
var WEEKDAYS=['日','一','二','三','四','五','六'];
var WEEKDAYS_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

document.getElementById('today-badge').textContent = '今天：2026年5月26日';

function dotColor(who){
  if(who==='angie') return '#1D9E75';
  if(who==='kenny') return '#378ADD';
  if(who==='bday')  return '#D4537E';
  if(who==='family')return '#E9A020';
  return '#D0202A';
}
function eventClass(who){
  if(who==='angie') return 'we-angie';
  if(who==='kenny') return 'we-kenny';
  if(who==='bday')  return 'we-bday';
  if(who==='family')return 'we-family';
  return 'we-holiday';
}
function dayEventClass(who){
  if(who==='angie') return 'de-angie';
  if(who==='kenny') return 'de-kenny';
  if(who==='bday')  return 'de-bday';
  if(who==='family')return 'de-family';
  return 'de-holiday';
}

function getEventsForDate(dateStr){
  return EVENTS.filter(function(e){
    if(e.date!==dateStr) return false;
    if(curWho==='all') return true;
    return e.who===curWho;
  });
}

function dateStr(y,m,d){
  return y+'-'+(m+1<10?'0'+(m+1):(m+1))+'-'+(d<10?'0'+d:d);
}

function isToday(y,m,d){
  return y===2026&&m===4&&d===26;
}

// ============================================================
// MONTH VIEW
// ============================================================
function renderMonth(){
  var y=curYear, m=curMonth;
  var firstDay=new Date(y,m,1).getDay();
  var daysInMonth=new Date(y,m+1,0).getDate();
  var daysInPrev=new Date(y,m,0).getDate();

  var html='<div class="month-grid">';
  ['一','二','三','四','五','六','日'].forEach(function(d){
    html+='<div class="month-header">'+d+'</div>';
  });

  // 調整：月曆從週一開始
  var startOffset=(firstDay+6)%7;
  var cells=[];
  for(var i=startOffset-1;i>=0;i--) cells.push({d:daysInPrev-i,cur:false});
  for(var i=1;i<=daysInMonth;i++) cells.push({d:i,cur:true});
  while(cells.length%7!==0) cells.push({d:cells.length-daysInMonth-startOffset+1,cur:false});

  cells.forEach(function(cell){
    var cm=cell.cur?m:(cells.indexOf(cell)<7?m-1:m+1);
    var cy=y;
    if(cm<0){cm=11;cy--;}
    if(cm>11){cm=0;cy++;}
    var ds=dateStr(cy,cm,cell.d);
    var isHoli=HOLIDAYS[ds];
    var isTod=isToday(cy,cm,cell.d)&&cell.cur;
    var cls='month-cell'+(cell.cur?'':' other-month')+(isTod?' today-cell':'');
    html+='<div class="'+cls+'">';
    html+='<div class="cell-num'+(isHoli?' holiday-num':'')+'">';
    if(isTod) html+='<div style="background:var(--text);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;">'+cell.d+'</div>';
    else html+=cell.d;
    html+='</div>';

    if(isHoli&&cell.cur){
      html+='<div class="cell-event"><span class="cell-dot" style="background:#D0202A"></span><span class="cell-title" style="color:#D0202A;">'+isHoli+'</span></div>';
    }

    var evs=getEventsForDate(ds);
    var shown=0;
    evs.forEach(function(e){
      if(shown>=2){return;}
      var titleText = ((e.time !== '全天' && e.time !== '節日') ? e.time + ' ' : '') + e.name;
      html+='<div class="cell-event"><span class="cell-dot" style="background:'+dotColor(e.who)+'"></span><span class="cell-title">'+titleText+'</span></div>';
      shown++;
    });
    if(evs.length>2) html+='<div class="cell-more">+還有'+(evs.length-2)+'項</div>';
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('calendar-area').innerHTML=html;
}

// ============================================================
// WEEK VIEW
// ============================================================
function renderWeek(){
  // 找到當週週一
  var base=new Date(curYear,curMonth,curDay);
  var dow=base.getDay();
  var monday=new Date(base); monday.setDate(base.getDate()-((dow+6)%7));

  var days=[];
  for(var i=0;i<7;i++){
    var d=new Date(monday); d.setDate(monday.getDate()+i);
    days.push(d);
  }

  var html='<div class="week-grid">';
  // headers
  html+='<div class="week-col-header"></div>';
  days.forEach(function(d){
    var ds=dateStr(d.getFullYear(),d.getMonth(),d.getDate());
    var isTod=d.getFullYear()===2026&&d.getMonth()===4&&d.getDate()===26;
    var isHoli=HOLIDAYS[ds];
    html+='<div class="week-col-header">';
    html+='<div class="week-day-name">'+['日','一','二','三','四','五','六'][d.getDay()]+'</div>';
    html+='<div class="week-day-num'+(isTod?' today-num':'')+(isHoli?' holi-num':'')+'">'+d.getDate()+'</div>';
    html+='</div>';
  });

  // time slots 7:00-22:00
  for(var h=7;h<=22;h++){
    html+='<div class="time-label">'+(h<10?'0'+h:h)+':00</div>';
    days.forEach(function(d){
      var ds=dateStr(d.getFullYear(),d.getMonth(),d.getDate());
      var evs=getEventsForDate(ds).filter(function(e){
        if(e.time==='全天'||e.time==='節日') return h===7;
        var eh=parseInt(e.time.split(':')[0]);
        return eh===h;
      });
      html+='<div class="week-cell">';
      evs.forEach(function(e){
        html+='<div class="week-event '+eventClass(e.who)+'">'+e.time+' '+e.name+'</div>';
      });
      html+='</div>';
    });
  }
  html+='</div>';
  document.getElementById('calendar-area').innerHTML=html;
}

// ============================================================
// DAY VIEW
// ============================================================
function renderDay(){
  var ds=dateStr(curYear,curMonth,curDay);
  var isHoli=HOLIDAYS[ds];
  var allEvs=getEventsForDate(ds);
  var allDay=allEvs.filter(function(e){return e.time==='全天'||e.time==='節日';});
  var timed=allEvs.filter(function(e){return e.time!=='全天'&&e.time!=='節日';});

  var d=new Date(curYear,curMonth,curDay);
  var header=curYear+'年'+(curMonth+1)+'月'+curDay+'日（'+['日','一','二','三','四','五','六'][d.getDay()]+'）';
  if(isHoli) header+=' — '+isHoli+' 🎉';

  var html='<div style="padding:10px 0 12px;font-size:15px;font-weight:500;color:var(--text);">'+header+'</div>';

  if(allDay.length){
    html+='<div style="margin-bottom:10px;">';
    allDay.forEach(function(e){
      html+='<div class="day-event-item '+dayEventClass(e.who)+'" style="margin-bottom:5px;">全天｜'+e.name+'</div>';
    });
    html+='</div>';
  }

  html+='<div class="day-view-wrap">';
  for(var h=7;h<=22;h++){
    var hStr=(h<10?'0'+h:h)+':00';
    var evs=timed.filter(function(e){return parseInt(e.time.split(':')[0])===h;});
    html+='<div class="day-time-slot">'+hStr+'</div>';
    html+='<div class="day-event-slot">';
    evs.forEach(function(e){
      html+='<div class="day-event-item '+dayEventClass(e.who)+'">'+e.time+'　'+e.name+'</div>';
    });
    html+='</div>';
  }
  html+='</div>';
  document.getElementById('calendar-area').innerHTML=html;
}

// ============================================================
// SPECIAL VIEWS (生日/家族/假日)
// ============================================================
function renderBday(){
  var html='';
  for(var month in BDAY_DATA){
    html+='<div class="bday-section"><div class="bday-month-title">🎂 '+month+'</div>';
    BDAY_DATA[month].forEach(function(b){
      html+='<div class="bday-item"><div class="bday-date-box"><div class="bday-date-num">'+b.date+'</div><div class="bday-date-day">'+b.day+'</div></div><div class="bday-avatar">🎂</div><div><div class="bday-name">'+b.name+'</div></div></div>';
    });
    html+='</div>';
  }
  document.getElementById('bday-content').innerHTML=html;
}

// ============================================================
// NAV
// ============================================================
function updateNavLabel(){
  if(curMode==='month') document.getElementById('nav-label').textContent=curYear+'年'+(curMonth+1)+'月';
  else if(curMode==='week'){
    var base=new Date(curYear,curMonth,curDay);
    var dow=base.getDay();
    var mon=new Date(base); mon.setDate(base.getDate()-((dow+6)%7));
    var sun=new Date(mon); sun.setDate(mon.getDate()+6);
    document.getElementById('nav-label').textContent=(mon.getMonth()+1)+'/'+mon.getDate()+' – '+(sun.getMonth()+1)+'/'+sun.getDate();
  } else {
    document.getElementById('nav-label').textContent=curYear+'年'+(curMonth+1)+'月'+curDay+'日';
  }
}

function navPrev(){
  if(curMode==='month'){ curMonth--; if(curMonth<0){curMonth=11;curYear--;} }
  else if(curMode==='week'){ var d=new Date(curYear,curMonth,curDay); d.setDate(d.getDate()-7); curYear=d.getFullYear();curMonth=d.getMonth();curDay=d.getDate(); }
  else { var d=new Date(curYear,curMonth,curDay); d.setDate(d.getDate()-1); curYear=d.getFullYear();curMonth=d.getMonth();curDay=d.getDate(); }
  updateNavLabel(); render();
}
function navNext(){
  if(curMode==='month'){ curMonth++; if(curMonth>11){curMonth=0;curYear++;} }
  else if(curMode==='week'){ var d=new Date(curYear,curMonth,curDay); d.setDate(d.getDate()+7); curYear=d.getFullYear();curMonth=d.getMonth();curDay=d.getDate(); }
  else { var d=new Date(curYear,curMonth,curDay); d.setDate(d.getDate()+1); curYear=d.getFullYear();curMonth=d.getMonth();curDay=d.getDate(); }
  updateNavLabel(); render();
}
function goToday(){ curYear=2026;curMonth=4;curDay=26; updateNavLabel(); render(); }

// ============================================================
// RENDER
// ============================================================
function render(){
  var isSpecial=(curWho==='bday'||curWho==='family'||curWho==='holiday');
  document.getElementById('calendar-area').style.display=isSpecial?'none':'';
  document.getElementById('nav-bar').style.display=isSpecial?'none':'';
  document.getElementById('view-mode-bar').style.display=isSpecial?'none':'';
  document.getElementById('main-legend').style.display=isSpecial?'none':'';
  ['special-bday','special-family','special-holiday'].forEach(function(id){
    document.getElementById(id).style.display='none';
  });
  if(curWho==='bday'){ renderBday(); document.getElementById('special-bday').style.display=''; return; }
  if(curWho==='family'){ document.getElementById('special-family').style.display=''; return; }
  if(curWho==='holiday'){ document.getElementById('special-holiday').style.display=''; return; }

  if(curMode==='month') renderMonth();
  else if(curMode==='week') renderWeek();
  else renderDay();
}

function setWho(w, btn){
  curWho=w;
  document.querySelectorAll('.who-btn').forEach(function(b){ b.className='who-btn'; });
  var clsMap={all:'active',angie:'angie-on',kenny:'kenny-on',bday:'bday-on',family:'family-on',holiday:'holiday-on'};
  btn.className='who-btn '+clsMap[w];
  render();
}

function setMode(m, btn){
  curMode=m;
  document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  updateNavLabel(); render();
}

// INIT
async function initCalendar(){
  updateNavLabel();
  document.getElementById('calendar-area').innerHTML =
    '<div style="padding:16px;border:0.5px solid var(--border2);border-radius:10px;background:var(--bg2);color:var(--text2);font-size:13px;">⏳ 正在讀取 Google Sheets 行程資料...</div>';
  try {
    await loadEventsFromGoogleSheet();
    if (!EVENTS.length) {
      showLoadError('Google Sheets 已連線，但 EVENTS 分頁沒有讀到任何有效資料。請確認第 1 列是 date / who / time / name，且第 2 列開始有資料。');
      return;
    }
    render();
  } catch (err) {
    console.error(err);
    showLoadError(err.message || err);
  }
}
initCalendar();
</script>
